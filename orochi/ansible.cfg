[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
# 'yaml' lived in community.general and was removed on newer ansible-core
# (2.13+), which aborts the run at load. 'default' is built in and always
# present. profile_tasks (task timings) is still shipped in community.general.
stdout_callback = default
callbacks_enabled = profile_tasks
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 86400
ask_vault_pass = False
log_path = install.log

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False
become_flags = -H

[ssh_connection]
pipelining = False
# ControlPersist must outlive fuse's interactive prompts (op name, passwords,
# menu, interface selection) — a 60s socket expiring mid-pause causes
# "process object is closed" errors on ansible-core 2.19.
ssh_args = -o ControlMaster=auto -o ControlPersist=600s -o ServerAliveInterval=30