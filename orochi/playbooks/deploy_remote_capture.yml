---
# Deploy a standalone Arkime capture node on the management box or any
# remote box (SSH as root). Ships session data to the orochi node's
# Elasticsearch. PCAP files are stored locally on the capture box.
#
# Run from the management box:
#   ansible-playbook ~/orochi/orochi/playbooks/deploy_remote_capture.yml
#
# Or with explicit overrides:
#   ansible-playbook ... -e remote_capture_interface=eth1 -e capture_target=192.168.10.5

# ── Play 1: Read .env, add orochi node + capture target to inventory ──────────

- name: Resolve configuration
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Read .env file
      ansible.builtin.shell: cat {{ playbook_dir }}/../.env 2>/dev/null || true
      register: _env_content
      changed_when: false

    - name: Fail if .env missing
      ansible.builtin.fail:
        msg: ".env not found — run fuse.yml against the orochi node first."
      when: _env_content.stdout | trim | length == 0

    - name: Parse .env values
      ansible.builtin.set_fact:
        orochi_node_ip:         "{{ _env_content.stdout | regex_search('OROCHI_NODE_IP=(.+)',         '\\1') | first | trim }}"
        arkime_password_secret: "{{ _env_content.stdout | regex_search('ARKIME_PASSWORD_SECRET=(.+)', '\\1') | first | trim }}"
        mgmt_box_ip:            "{{ _env_content.stdout | regex_search('MGMT_BOX_IP=(.+)',            '\\1') | default(['10.16.255.253'], true) | first | trim }}"
        mgmt_registry_port:     "{{ _env_content.stdout | regex_search('MGMT_REGISTRY_PORT=(.+)',     '\\1') | default(['5000'],         true) | first | trim }}"
        arkime_version:         "{{ _env_content.stdout | regex_search('ARKIME_VERSION=(.+)',         '\\1') | default(['v6-latest'],    true) | first | trim }}"

    - name: Add orochi node to inventory
      ansible.builtin.add_host:
        name: orochi
        groups: orochi_node
        ansible_host: "{{ orochi_node_ip }}"
        ansible_user: orochi
        ansible_ssh_private_key_file: ~/.ssh/orochi_id_ed25519

    - name: Prompt for capture target
      ansible.builtin.pause:
        prompt: |
          Arkime Remote Capture target:
            Press Enter  →  this box (mgmt box / localhost)
            Enter IP     →  remote host (SSH as root)

          Target
      register: _capture_input
      when: capture_target is not defined

    - name: Set capture target fact
      ansible.builtin.set_fact:
        _capture_target: "{{ capture_target | default(_capture_input.user_input | default('') | trim, true) }}"

    - name: Add localhost as capture target
      ansible.builtin.add_host:
        name: localhost
        groups: capture_targets
        ansible_connection: local
      when: (_capture_target | length == 0) or (_capture_target | lower == 'localhost')

    - name: Add remote host as capture target
      ansible.builtin.add_host:
        name: "{{ _capture_target }}"
        groups: capture_targets
        ansible_host: "{{ _capture_target }}"
        ansible_user: root
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
      when:
        - _capture_target | length > 0
        - _capture_target | lower != 'localhost'

    - name: Show resolved config
      ansible.builtin.debug:
        msg:
          - "Orochi node:    {{ orochi_node_ip }}"
          - "Mgmt box:       {{ mgmt_box_ip }}"
          - "Arkime version: {{ arkime_version }}"
          - "Capture target: {{ _capture_target | default('localhost', true) }}"

# ── Play 2: Fetch CA cert from orochi node ────────────────────────────────────

- name: Fetch CA cert from orochi node
  hosts: orochi_node
  become: true
  gather_facts: false

  tasks:
    - name: Read CA cert
      ansible.builtin.slurp:
        src: /opt/orochi/certs/ca/ca.crt
      register: _ca_cert_b64

# ── Play 3: Deploy capture container on the capture target ────────────────────

- name: Deploy Arkime remote capture
  hosts: capture_targets
  become: true
  gather_facts: true

  vars:
    remote_capture_interface: "eth0"
    remote_pcap_dir:          "/opt/orochi-remote/raw"
    remote_cert_dir:          "/opt/orochi-remote/certs"
    remote_capture_port:      8007
    orochi_es_port:           9200

  vars_prompt:
    - name: elasticsearch_password
      prompt: "Elasticsearch password (the engagement password)"
      private: true

  tasks:
    - name: Resolve image registry and viewer host
      ansible.builtin.set_fact:
        _registry_host: "{{ 'localhost' if (inventory_hostname == 'localhost') else hostvars['localhost']['mgmt_box_ip'] }}"
        _view_host:     "{{ hostvars['localhost']['mgmt_box_ip'] if (inventory_hostname == 'localhost') else ansible_host }}"

    - name: Ensure remote Docker daemon trusts the management box registry
      # Remote boxes pull over plain HTTP from the mgmt registry — the daemon
      # must list it as insecure. localhost registries are trusted by default.
      when: inventory_hostname != 'localhost'
      block:
        - name: Check if insecure registry is already active
          ansible.builtin.shell: |
            docker info 2>/dev/null | grep -q "{{ hostvars['localhost']['mgmt_box_ip'] }}:{{ hostvars['localhost']['mgmt_registry_port'] }}" && echo "configured" || echo "needs_config"
          register: _remote_registry_check
          changed_when: false

        - name: Configure Docker daemon insecure registry
          ansible.builtin.copy:
            dest: /etc/docker/daemon.json
            content: |
              {
                "insecure-registries": ["{{ hostvars['localhost']['mgmt_box_ip'] }}:{{ hostvars['localhost']['mgmt_registry_port'] }}"]
              }
            mode: '0644'
          when: _remote_registry_check.stdout | trim == "needs_config"

        - name: Restart Docker to load insecure registry config
          ansible.builtin.systemd:
            name: docker
            state: restarted
            daemon_reload: true
          when: _remote_registry_check.stdout | trim == "needs_config"

    - name: Prompt for capture interface if not set via -e
      ansible.builtin.pause:
        prompt: |
          Available interfaces:
          {{ ansible_interfaces | reject('match', '^(lo|docker|br-|veth)') | list | join(', ') }}

          Enter capture interface
      register: _iface_input
      when: remote_capture_interface == "eth0"

    - name: Set interface from prompt
      ansible.builtin.set_fact:
        remote_capture_interface: "{{ _iface_input.user_input | trim }}"
      when:
        - remote_capture_interface == "eth0"
        - _iface_input.user_input | default('') | trim | length > 0

    - name: Create directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ remote_pcap_dir }}"
        - "{{ remote_cert_dir }}"

    - name: Set PCAP directory ownership
      ansible.builtin.file:
        path: "{{ remote_pcap_dir }}"
        owner: nobody
        group: nogroup
        mode: '0755'

    - name: Place orochi CA cert
      ansible.builtin.copy:
        content: "{{ hostvars['orochi']['_ca_cert_b64']['content'] | b64decode }}"
        dest: "{{ remote_cert_dir }}/ca.crt"
        mode: '0644'

    - name: Set capture interface to promiscuous mode
      ansible.builtin.shell: ip link set {{ remote_capture_interface }} promisc on
      changed_when: false

    - name: Remove any existing remote capture container
      community.docker.docker_container:
        name: arkimecapture-remote
        state: absent
        force_kill: true

    - name: Start Arkime remote capture container
      community.docker.docker_container:
        name: arkimecapture-remote
        image: "{{ _registry_host }}:{{ hostvars['localhost']['mgmt_registry_port'] }}/arkime/arkime:{{ hostvars['localhost']['arkime_version'] }}"
        state: started
        restart_policy: unless-stopped
        network_mode: host
        capabilities:
          - NET_ADMIN
          - NET_RAW
        ulimits:
          - "memlock:-1:-1"
        env:
          ARKIME__elasticsearch:          "https://{{ hostvars['localhost']['orochi_node_ip'] }}:{{ orochi_es_port }}"
          ARKIME__elasticsearchBasicAuth: "elastic:{{ elasticsearch_password }}"
          ARKIME__caTrustFile:            "/opt/arkime/etc/ca.crt"
          ARKIME__passwordSecret:         "{{ hostvars['localhost']['arkime_password_secret'] }}"
          ARKIME__interface:              "{{ remote_capture_interface }}"
          ARKIME__pcapDir:                "/opt/arkime/raw"
          ARKIME__viewPort:               "{{ remote_capture_port | string }}"
          ARKIME__viewHost:               "{{ _view_host }}"
          ARKIME__node:                   "{{ ansible_hostname }}"
          ARKIME__maxFileSizeG:           "5"
          ARKIME__freeSpaceG:             "5%"
          ARKIME__rotateIndex:            "daily"
          ARKIME__compressES:             "true"
          ARKIME__dropUser:               "nobody"
          ARKIME__dropGroup:              "nogroup"
        volumes:
          - "{{ remote_pcap_dir }}:/opt/arkime/raw"
          - "{{ remote_cert_dir }}/ca.crt:/opt/arkime/etc/ca.crt:ro"
        command: /opt/arkime/bin/docker.sh capture

    - name: Wait for capture to initialise
      ansible.builtin.wait_for:
        timeout: 15

    - name: Check capture container logs
      ansible.builtin.command: docker logs --tail 20 arkimecapture-remote
      register: _capture_logs
      changed_when: false

    - name: Display capture logs
      ansible.builtin.debug:
        msg: "{{ _capture_logs.stdout_lines + _capture_logs.stderr_lines }}"

    - name: Display remote capture status
      ansible.builtin.debug:
        msg:
          - "Remote Arkime capture deployed on {{ ansible_hostname }}"
          - ""
          - "Interface: {{ remote_capture_interface }}"
          - "PCAP dir:  {{ remote_pcap_dir }}"
          - "ES target: https://{{ hostvars['localhost']['orochi_node_ip'] }}:{{ orochi_es_port }}"
          - ""
          - "Sessions from this node appear in Arkime tagged as: {{ ansible_hostname }}"
          - "docker logs -f arkimecapture-remote"
