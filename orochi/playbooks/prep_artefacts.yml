---
# prep_artefacts.yml
# Run on the management box BEFORE going on-site.
# Requires internet. Downloads and caches everything needed for offline deployment.
#
# Usage (run directly on the management box — no flags needed):
#   ansible-playbook playbooks/prep_artefacts.yml

- name: Pre-cache all Orochi deployment artefacts
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars_files:
    - "{{ playbook_dir }}/../group_vars/all.yml"

  vars:
    artifacts_dir: /opt/orochi/artifacts
    registry_data_dir: /opt/orochi/registry

    docker_images:
      - src: "docker.elastic.co/elasticsearch/elasticsearch:{{ stack_version }}"
        local: "elasticsearch/elasticsearch:{{ stack_version }}"
      - src: "docker.elastic.co/kibana/kibana:{{ stack_version }}"
        local: "kibana/kibana:{{ stack_version }}"
      - src: "docker.elastic.co/elastic-agent/elastic-agent:{{ stack_version }}"
        local: "elastic-agent/elastic-agent:{{ stack_version }}"
      - src: "docker.elastic.co/elasticsearch/elasticsearch:{{ elasticsearch_hive_version }}"
        local: "elasticsearch/elasticsearch:{{ elasticsearch_hive_version }}"
      - src: "cassandra:{{ cassandra_version }}"
        local: "cassandra:{{ cassandra_version }}"
      - src: "thehiveproject/thehive4:{{ thehive_version }}"
        local: "thehiveproject/thehive4:{{ thehive_version }}"
      - src: "debian:bookworm-slim"
        local: "debian:bookworm-slim"
      - src: "mattermost/mattermost-team-edition:{{ mattermost_version }}"
        local: "mattermost/mattermost-team-edition:{{ mattermost_version }}"
      - src: "postgres:{{ postgres_version }}"
        local: "postgres:{{ postgres_version }}"
      - src: "ghcr.io/gchq/cyberchef:{{ cyberchef_version }}"
        local: "gchq/cyberchef:{{ cyberchef_version }}"
      - src: "nginx:{{ portal_version }}"
        local: "nginx:{{ portal_version }}"
      - src: "us-docker.pkg.dev/osdfir-registry/timesketch/timesketch:{{ timesketch_version }}"
        local: "timesketch/timesketch:{{ timesketch_version }}"
      - src: "redis:{{ redis_version }}"
        local: "redis:{{ redis_version }}"
      - src: "ghcr.io/arkime/arkime/arkime:{{ arkime_version }}"
        local: "arkime/arkime:{{ arkime_version }}"

    binary_artifacts:
      - url: "https://github.com/activecm/rita/releases/download/{{ rita_version }}/rita-{{ rita_version }}.tar.gz"
        dest: "rita-{{ rita_version }}.tar.gz"
      - url: "https://download.opensuse.org/repositories/security:/zeek/xUbuntu_24.04/Release.key"
        dest: "zeek-release.key"

  tasks:

    - name: Create artifact directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ artifacts_dir }}"
        - "{{ artifacts_dir }}/docker-debs"
        - "{{ artifacts_dir }}/zeek-debs"
        - "{{ artifacts_dir }}/suricata-debs"
        - "{{ registry_data_dir }}"

    # ── Elastic Stack version selection ───────────────────────────────────────

    - name: Check latest Elastic Stack version
      ansible.builtin.uri:
        url: https://artifacts-api.elastic.co/v1/versions
        return_content: true
        timeout: 10
      register: _elastic_versions_raw
      failed_when: false
      changed_when: false

    - name: Parse latest PUBLICLY DOWNLOADABLE Elastic Stack version
      # The artifacts API lists versions that are STAGED but not yet publicly
      # released. They carry no -SNAPSHOT suffix, so a naive "highest version
      # wins" picks something whose binaries return 404 on
      # artifacts.elastic.co and whose images are absent from docker.elastic.co
      # (observed: prep offering 9.5.0 when 9.4.4 was the newest real release).
      # So: walk newest-first and select the first version that actually has a
      # downloadable artefact. HEAD requests only — no payload is fetched.
      ansible.builtin.shell: |
        python3 - <<'EOF'
        import json, re, sys, urllib.request, urllib.error
        versions = {{ _elastic_versions_raw.json.versions | to_json }}
        stable = sorted(
          [v for v in versions if re.match(r'^[0-9]+\.[0-9]+\.[0-9]+$', v)],
          key=lambda v: tuple(int(x) for x in v.split('.')),
          reverse=True
        )
        def probe(v):
            url = ("https://artifacts.elastic.co/downloads/beats/elastic-agent/"
                   "elastic-agent-%s-linux-x86_64.tar.gz" % v)
            req = urllib.request.Request(url, method='HEAD')
            try:
                with urllib.request.urlopen(req, timeout=15) as r:
                    return r.status, None
            except urllib.error.HTTPError as e:
                return e.code, None
            except Exception as e:
                return None, type(e).__name__
        errors = 0
        for v in stable[:8]:
            code, err = probe(v)
            if err:
                errors += 1
                sys.stderr.write("  %s: probe error (%s)\n" % (v, err))
                continue
            sys.stderr.write("  %s: HTTP %s\n" % (v, code))
            if code == 200:
                print(v)
                sys.exit(0)
        # Reaching here means nothing was confirmed published. Distinguish
        # "all probes errored" (network/proxy problem) from "genuinely not
        # published" so the operator is not sent chasing the wrong thing.
        if errors:
            sys.stderr.write(
                "WARNING: could not reach artifacts.elastic.co to confirm which "
                "versions are published - you will be prompted to enter the "
                "version manually.\n")
        EOF
      register: _elastic_latest_raw
      changed_when: false
      when:
        - _elastic_versions_raw.status is defined
        - _elastic_versions_raw.status == 200

    - name: Set latest Elastic Stack version fact
      ansible.builtin.set_fact:
        _elastic_latest: "{{ _elastic_latest_raw.stdout | trim }}"
      when:
        - _elastic_latest_raw.stdout is defined
        - _elastic_latest_raw.stdout | trim | length > 0

    - name: Warn if version detection failed
      ansible.builtin.debug:
        msg: "WARNING: Could not detect latest Elastic Stack version from API — you will be prompted."
      when: _elastic_latest is not defined

    - name: Prompt — use detected latest version?
      ansible.builtin.pause:
        prompt: "Found latest Elastic Stack {{ _elastic_latest }}. Use this? [Y/n]"
        echo: yes
      register: _use_latest_input
      when: _elastic_latest is defined

    - name: Prompt — enter Elastic Stack version manually
      ansible.builtin.pause:
        prompt: "Enter Elastic Stack version to download [{{ stack_version }}]"
        echo: yes
      register: _manual_version_input
      when: >-
        (_elastic_latest is not defined) or
        ((_use_latest_input | default({})).user_input | default('') | lower in ['n', 'no'])

    - name: Set final Elastic Stack version
      ansible.builtin.set_fact:
        stack_version: >-
          {%- set _decline = (_use_latest_input | default({})).user_input | default('') | lower in ['n', 'no'] -%}
          {%- set _manual  = (_manual_version_input | default({})).user_input | default('') | trim -%}
          {%- if _elastic_latest is defined and not _decline -%}
            {{ _elastic_latest }}
          {%- elif _manual | length > 0 -%}
            {{ _manual }}
          {%- else -%}
            {{ stack_version }}
          {%- endif -%}

    - name: Persist stack_version to group_vars/all.yml
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/../group_vars/all.yml"
        regexp: '^stack_version:'
        line: "stack_version: \"{{ stack_version }}\""

    - name: Confirm Elastic Stack version in use
      ansible.builtin.debug:
        msg: "Using Elastic Stack version: {{ stack_version }}"

    # ── Arkime Docker image tag ────────────────────────────────────────────────

    - name: Confirm Arkime Docker image tag in use
      ansible.builtin.debug:
        msg: "Arkime Docker image: ghcr.io/arkime/arkime/arkime:{{ arkime_version }}"

    # ── Local Docker registry ──────────────────────────────────────────────────

    - name: Ensure local Docker registry is running
      community.docker.docker_container:
        name: orochi-registry
        image: registry:2
        state: started
        restart_policy: unless-stopped
        ports:
          - "5000:5000"
        volumes:
          - "{{ registry_data_dir }}:/var/lib/registry"

    - name: Wait for registry to be ready
      ansible.builtin.uri:
        url: http://localhost:5000/v2/
        status_code: 200
      register: registry_ready
      until: registry_ready.status == 200
      retries: 10
      delay: 3

    # ── Docker images ──────────────────────────────────────────────────────────

    - name: Pull Docker image
      # Retried: public registries reset connections mid-transfer (common over
      # IPv6). Without this a single reset fails the whole prep run.
      community.docker.docker_image:
        name: "{{ item.src }}"
        source: pull
        force_source: true
      loop: "{{ docker_images }}"
      loop_control:
        label: "{{ item.src }}"
      register: _img_pull
      until: _img_pull is succeeded
      retries: 4
      delay: 10

    - name: Tag and push to local registry
      # push retried for the same transient-reset reason.
      ansible.builtin.shell: |
        set -e
        n=0
        until docker tag "{{ item.src }}" "localhost:5000/{{ item.local }}" \
           && docker push "localhost:5000/{{ item.local }}"; do
          n=$((n + 1))
          [ "$n" -ge 4 ] && { echo "push failed after 4 attempts: {{ item.local }}" >&2; exit 1; }
          echo "retry ${n}/4 in $((n * 5))s: {{ item.local }}" >&2
          sleep $((n * 5))
        done
      loop: "{{ docker_images }}"
      loop_control:
        label: "{{ item.local }}"
      changed_when: true

    # ── RITA version selection ─────────────────────────────────────────────────

    - name: Check latest RITA release
      ansible.builtin.uri:
        url: https://api.github.com/repos/activecm/rita/releases/latest
        return_content: true
        timeout: 10
      register: _rita_latest_raw
      failed_when: false
      changed_when: false

    - name: Set latest RITA version fact
      ansible.builtin.set_fact:
        _rita_latest: "{{ _rita_latest_raw.json.tag_name }}"
      when:
        - _rita_latest_raw.status is defined
        - _rita_latest_raw.status == 200
        - _rita_latest_raw.json.tag_name is defined

    - name: Warn if RITA version detection failed
      ansible.builtin.debug:
        msg: "WARNING: Could not detect latest RITA version from GitHub — you will be prompted."
      when: _rita_latest is not defined

    - name: Prompt — use detected latest RITA version?
      ansible.builtin.pause:
        prompt: "Found latest RITA {{ _rita_latest }} (currently pinned: {{ rita_version }}). Use this? [Y/n]"
        echo: yes
      register: _use_latest_rita
      when: _rita_latest is defined

    - name: Prompt — enter RITA version manually
      ansible.builtin.pause:
        prompt: "Enter RITA version to download [{{ rita_version }}]"
        echo: yes
      register: _manual_rita_input
      when: >-
        (_rita_latest is not defined) or
        ((_use_latest_rita | default({})).user_input | default('') | lower in ['n', 'no'])

    - name: Set final RITA version
      ansible.builtin.set_fact:
        rita_version: >-
          {%- set _decline = (_use_latest_rita | default({})).user_input | default('') | lower in ['n', 'no'] -%}
          {%- set _manual  = (_manual_rita_input | default({})).user_input | default('') | trim -%}
          {%- if _rita_latest is defined and not _decline -%}
            {{ _rita_latest }}
          {%- elif _manual | length > 0 -%}
            {{ _manual }}
          {%- else -%}
            {{ rita_version }}
          {%- endif -%}

    - name: Persist rita_version to group_vars/all.yml
      ansible.builtin.lineinfile:
        path: "{{ playbook_dir }}/../group_vars/all.yml"
        regexp: '^rita_version:'
        line: "rita_version: \"{{ rita_version }}\""

    - name: Confirm RITA version in use
      ansible.builtin.debug:
        msg: "Using RITA version: {{ rita_version }}"

    # ── Binary artifacts ───────────────────────────────────────────────────────

    - name: Download binary artifacts
      ansible.builtin.get_url:
        url: "{{ item.url }}"
        dest: "{{ artifacts_dir }}/{{ item.dest }}"
        mode: '0755'
      loop: "{{ binary_artifacts }}"
      loop_control:
        label: "{{ item.dest }}"

    # ── Elastic Agent installers (node-hosted artifact registry) ─────────────
    # Endpoints on the target network can reach the orochi node but NOT
    # artifacts.elastic.co, so the node serves its own Elastic Artifact
    # Registry (roles/fleet). The directory layout below is not arbitrary —
    # Elastic Agent appends "beats/elastic-agent/<file>" to the configured
    # download-source host, so it must be mirrored exactly.
    # .sha512 and .asc accompany each package: agent verifies both during
    # install and upgrade, and a missing checksum fails the upgrade.

    - name: Create Elastic Agent artifact registry directory
      ansible.builtin.file:
        path: "{{ artifacts_dir }}/elastic-artifacts/beats/elastic-agent"
        state: directory
        mode: '0755'

    - name: Discover available Elastic Agent packages for this stack version
      # Authoritative list straight from Elastic, so the mirror always matches
      # the version being deployed with no hand-maintained filenames.
      ansible.builtin.uri:
        url: "https://artifacts-api.elastic.co/v1/search/{{ stack_version }}/elastic-agent"
        return_content: true
        timeout: 30
      register: _ea_api
      failed_when: false
      changed_when: false
      when: elastic_agent_artifacts | length == 0

    - name: Build the Elastic Agent package list
      # Keeps only what an ENDPOINT installs: name must be exactly
      # elastic-agent-<version>-* (excludes the -core/-fips/-cloud/-slim/
      # -wolfi/-complete/-service/-ironbank variants) AND the package type must
      # be a real installer (excludes docker images and build contexts, which
      # otherwise sail through the name filter as .tar.gz files).
      ansible.builtin.set_fact:
        elastic_agent_artifacts: >-
          {{ (_ea_api.json.packages | default({}) | dict2items
              | selectattr('key', 'match', '^elastic-agent-' ~ (stack_version | regex_escape) ~ '-')
              | selectattr('value.type', 'in', elastic_agent_package_types)
              | map(attribute='key') | sort | list) }}
      when: elastic_agent_artifacts | length == 0

    - name: Fail if no Elastic Agent packages could be resolved
      ansible.builtin.fail:
        msg: >-
          Could not determine Elastic Agent packages for {{ stack_version }}
          (artifacts API status {{ _ea_api.status | default('unreachable') }}).
          Check internet access from this box, or pin an explicit
          elastic_agent_artifacts list in group_vars/all.yml.
      when: elastic_agent_artifacts | length == 0

    - name: Show the Elastic Agent packages to be mirrored
      ansible.builtin.debug:
        msg: "{{ ['Mirroring ' ~ (elastic_agent_artifacts | length) ~ ' Elastic Agent packages for ' ~ stack_version ~ ' (plus .sha512 and .asc for each):'] + elastic_agent_artifacts }}"

    - name: Verify the packages are actually published (not a staged release)
      # The search API also answers for STAGED versions, returning
      # staging.elastic.co URLs. We mirror from the public
      # artifacts.elastic.co path, which 404s for anything not yet released.
      # Probe one package up front so the failure is a clear message rather
      # than a 404 twenty minutes into a multi-GB download loop.
      ansible.builtin.uri:
        url: "https://artifacts.elastic.co/downloads/beats/elastic-agent/{{ elastic_agent_artifacts | first }}"
        method: HEAD
        status_code: [200, 403, 404]
        timeout: 30
      register: _ea_probe
      changed_when: false

    - name: Fail if the chosen Elastic version is not publicly downloadable
      ansible.builtin.fail:
        msg: >-
          {{ elastic_agent_artifacts | first }} is not available on
          artifacts.elastic.co (HTTP {{ _ea_probe.status }}). Elastic Stack
          {{ stack_version }} appears to be STAGED but not publicly released
          yet. Re-run and choose the newest version that is actually
          published, or set stack_version explicitly in group_vars/all.yml.
      when: _ea_probe.status != 200

    - name: Check free space before mirroring Elastic Agent packages
      # These packages total ~10-12 GB. Running out of disk MID-download leaves
      # a half-written mirror that looks complete to a later run, so refuse up
      # front instead.
      ansible.builtin.shell: |
        df -BG --output=avail {{ artifacts_dir }} | tail -1 | tr -dc '0-9'
      register: _ea_free_gb
      changed_when: false

    - name: Fail if the management box is short on disk
      ansible.builtin.fail:
        msg: >-
          Only {{ _ea_free_gb.stdout }} GB free at {{ artifacts_dir }} —
          need at least {{ elastic_agent_mirror_min_free_gb }} GB to mirror
          {{ elastic_agent_artifacts | length }} Elastic Agent packages.
          Free space, or reduce the set by pinning elastic_agent_artifacts
          (or trimming elastic_agent_package_types) in group_vars/all.yml.
      when: (_ea_free_gb.stdout | int) < (elastic_agent_mirror_min_free_gb | int)

    - name: Download Elastic Agent installers (+ checksums and signatures)
      # force: false — filenames are version-pinned, so an existing file can
      # never be stale content. These are ~1 GB each; re-downloading them on
      # every prep run would be pure waste.
      ansible.builtin.get_url:
        url: "https://artifacts.elastic.co/downloads/beats/elastic-agent/{{ item.0 }}{{ item.1 }}"
        dest: "{{ artifacts_dir }}/elastic-artifacts/beats/elastic-agent/{{ item.0 }}{{ item.1 }}"
        mode: '0644'
        force: false
        timeout: 120
      loop: "{{ elastic_agent_artifacts | product(['', '.sha512', '.asc']) | list }}"
      loop_control:
        label: "{{ item.0 }}{{ item.1 }}"
      register: _ea_dl
      until: _ea_dl is succeeded
      retries: 3
      delay: 10

    # ── Prune superseded Elastic Agent packages ──────────────────────────────
    # Filenames are version-pinned and downloaded with force: false, so
    # WITHOUT this every Elastic version bump silently adds another ~12 GB and
    # nothing is ever reclaimed — the disk fills after two or three upgrades.
    # Runs only AFTER the new set has downloaded successfully, so a failed
    # download can never leave the box with no installers at all.

    - name: Find files currently in the Elastic Agent mirror
      ansible.builtin.find:
        paths: "{{ artifacts_dir }}/elastic-artifacts/beats/elastic-agent"
        patterns: "*"
      register: _ea_present

    - name: Prune Elastic Agent packages from superseded versions
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ _ea_present.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: (item.path | basename) not in (elastic_agent_artifacts | product(['', '.sha512', '.asc']) | map('join') | list)

    - name: Create Elastic Agent artifact manifest
      # The node reads this to know which files to mirror — so adding a
      # platform to elastic_agent_artifacts needs no node-side change.
      ansible.builtin.copy:
        content: "{{ elastic_agent_artifacts | to_nice_json }}\n"
        dest: "{{ artifacts_dir }}/elastic-artifacts/manifest.json"
        mode: '0644'

    - name: Write RITA version file
      # AUTHORITATIVE version record for the node. The rita role reads this
      # file from the artifact server instead of trusting group_vars, because
      # group_vars/all.yml gets overwritten by every repo push from the dev
      # machine — prep persisting a newly selected version there is undone by
      # the next push, leaving the node requesting a tarball that does not
      # exist (observed: prep cached v5.1.2, push reverted group_vars to
      # v5.1.1, node 404d). A version file living NEXT TO the artifact cannot
      # drift from it. Same pattern as zeek/suricata/velociraptor-version.txt.
      ansible.builtin.copy:
        content: "{{ rita_version }}\n"
        dest: "{{ artifacts_dir }}/rita-version.txt"
        mode: '0644'

    # ── Velociraptor — resolve latest release from GitHub API ─────────────────

    - name: Get latest Velociraptor release from GitHub
      ansible.builtin.uri:
        url: https://api.github.com/repos/Velocidex/velociraptor/releases/latest
        return_content: true
      register: velox_release

    - name: Parse Velociraptor download URL
      ansible.builtin.set_fact:
        velox_download_url: >-
          {{
            velox_release.json.assets
            | selectattr('name', 'search', 'linux-amd64')
            | rejectattr('name', 'search', 'sig')
            | rejectattr('name', 'search', 'musl')
            | map(attribute='browser_download_url')
            | first
          }}

    - name: Extract Velociraptor version from release tag
      ansible.builtin.set_fact:
        velox_version: "{{ velox_release.json.tag_name | regex_replace('^v', '') }}"

    - name: Download Velociraptor binary
      ansible.builtin.get_url:
        url: "{{ velox_download_url }}"
        dest: "{{ artifacts_dir }}/velociraptor-linux-amd64"
        mode: '0755'
        force: false

    - name: Write Velociraptor version file
      ansible.builtin.copy:
        content: "{{ velox_version }}\n"
        dest: "{{ artifacts_dir }}/velociraptor-version.txt"
        mode: '0644'

    # ── Docker .deb packages ───────────────────────────────────────────────────

    - name: Download Docker .deb packages (full closure, clean container)
      # CRITICAL: download the COMPLETE dependency closure inside a pristine
      # ubuntu:25.10 container, NOT on the management box. `apt-get install
      # --download-only` on the host only fetches dependencies the host does
      # NOT already have — and the mgmt box runs Docker, so it already has most
      # of them. That silently omits them from the bundle, leaving a minimal
      # node unable to install Docker offline. A clean container matching the
      # node's release has nothing pre-installed, so apt must download every
      # dependency. Over-inclusion is safe: roles/common installs with
      # `apt-get install <debs>`, which skips debs the node already has and
      # orders pre-dependencies correctly. The Docker repo + key are set up
      # INSIDE the container so the mgmt host apt config stays untouched.
      ansible.builtin.shell: |
        set -e
        rm -rf {{ artifacts_dir }}/docker-debs
        mkdir -p {{ artifacts_dir }}/docker-debs
        docker run --rm \
          -v {{ artifacts_dir }}/docker-debs:/debs \
          ubuntu:25.10 \
          bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends ca-certificates curl gnupg
            install -m 0755 -d /etc/apt/keyrings
            curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
              -o /etc/apt/keyrings/docker.asc
            chmod a+r /etc/apt/keyrings/docker.asc
            . /etc/os-release
            echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" \
              > /etc/apt/sources.list.d/docker.list
            apt-get update -qq
            apt-get install -y --download-only \
              -o Dir::Cache::Archives=/debs \
              docker-ce docker-ce-cli containerd.io \
              docker-buildx-plugin docker-compose-plugin
            chmod -R a+rX /debs
          '
        # apt leaves a partial/ dir and lock files; the node installs *.deb
        # (non-recursive) so those are ignored, but tidy up anyway.
        rm -rf {{ artifacts_dir }}/docker-debs/partial {{ artifacts_dir }}/docker-debs/lock
      changed_when: true

    - name: Create Docker debs tarball
      ansible.builtin.shell: |
        tar -czf {{ artifacts_dir }}/docker-debs.tar.gz \
          -C {{ artifacts_dir }} docker-debs/
      changed_when: true

    # ── Zeek .deb packages ─────────────────────────────────────────────────────

    - name: Download Zeek .deb packages (full closure, clean container)
      # Same rationale as Docker/Suricata: download the full dependency closure
      # in a pristine ubuntu:25.10 container so no host-installed dependency is
      # silently omitted from the bundle. --no-install-recommends is what keeps
      # courier/gnutls-bin/libunbound8 (NOT Zeek dependencies — they only ever
      # arrived as recommends) out of the bundle; those recommends riding along
      # in a host download were the root cause that contaminated earlier nodes
      # and blocked apt. The opensuse Zeek repo only publishes for
      # xUbuntu_24.04, but those packages install cleanly on 25.10 (what the
      # node runs), so a 25.10 container resolves the identical closure the node
      # needs. The repo + key are set up INSIDE the container; the mounted
      # zeek-release.key is the same one served to the node (single source).
      ansible.builtin.shell: |
        set -e
        rm -rf {{ artifacts_dir }}/zeek-debs
        mkdir -p {{ artifacts_dir }}/zeek-debs
        docker run --rm \
          -v {{ artifacts_dir }}/zeek-debs:/debs \
          -v {{ artifacts_dir }}/zeek-release.key:/zeek-release.key:ro \
          ubuntu:25.10 \
          bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --no-install-recommends gnupg ca-certificates
            install -m 0755 -d /etc/apt/keyrings
            gpg --dearmor < /zeek-release.key \
              > /etc/apt/keyrings/zeek-archive-keyring.gpg
            echo "deb [signed-by=/etc/apt/keyrings/zeek-archive-keyring.gpg] http://download.opensuse.org/repositories/security:/zeek/xUbuntu_24.04/ /" \
              > /etc/apt/sources.list.d/zeek.list
            apt-get update -qq
            apt-get install -y --download-only --no-install-recommends \
              -o Dir::Cache::Archives=/debs \
              zeek-core zeekctl zeek-client zeek-btest zeek-btest-data
            chmod -R a+rX /debs
          '
        rm -rf {{ artifacts_dir }}/zeek-debs/partial {{ artifacts_dir }}/zeek-debs/lock
      changed_when: true

    - name: Detect downloaded Zeek version
      ansible.builtin.shell: |
        FILE=$(ls {{ artifacts_dir }}/zeek-debs/zeek-core_*.deb 2>/dev/null | head -1)
        [ -n "$FILE" ] && dpkg-deb -f "$FILE" Version || echo ""
      register: _zeek_version_raw
      changed_when: false
      failed_when: false

    - name: Write Zeek version file
      ansible.builtin.copy:
        content: "{{ _zeek_version_raw.stdout | trim }}\n"
        dest: "{{ artifacts_dir }}/zeek-version.txt"
        mode: '0644'
      when: _zeek_version_raw.stdout | trim | length > 0

    - name: Create Zeek debs tarball
      ansible.builtin.shell: |
        tar -czf {{ artifacts_dir }}/zeek-debs.tar.gz \
          -C {{ artifacts_dir }} zeek-debs/
      changed_when: true

    # ── Suricata .deb packages — Ubuntu default repos ─────────────────────────

    - name: Download Suricata .deb packages (full closure, clean container)
      # CRITICAL: download inside a clean ubuntu:25.10 container, NOT on the
      # management box. `apt-get install --download-only` only fetches deps the
      # host does NOT already have installed — so building the bundle on the
      # mgmt box silently omits any dependency the mgmt box happens to have
      # (libunwind8, libpciaccess0, a current libjq1, ...), producing a bundle
      # that cannot satisfy Suricata offline on the node. A pristine container
      # matching the node's release has nothing pre-installed, so apt is forced
      # to download the COMPLETE dependency closure. Over-inclusion is safe (the
      # node skips debs it already has); under-inclusion is what broke us.
      ansible.builtin.shell: |
        set -e
        rm -rf {{ artifacts_dir }}/suricata-debs
        mkdir -p {{ artifacts_dir }}/suricata-debs
        docker run --rm \
          -v {{ artifacts_dir }}/suricata-debs:/debs \
          ubuntu:25.10 \
          bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y --download-only \
              -o Dir::Cache::Archives=/debs \
              suricata suricata-update jq \
              libevent-2.1-7t64 libevent-core-2.1-7t64 libevent-pthreads-2.1-7t64
            chmod -R a+rX /debs
          '
        # apt leaves a partial/ dir and lock files; the node installs /*.deb
        # (non-recursive glob) so those are ignored, but tidy up anyway.
        rm -rf {{ artifacts_dir }}/suricata-debs/partial {{ artifacts_dir }}/suricata-debs/lock
      changed_when: true

    - name: Detect downloaded Suricata version
      ansible.builtin.shell: |
        FILE=$(ls {{ artifacts_dir }}/suricata-debs/suricata_*.deb 2>/dev/null | head -1)
        [ -n "$FILE" ] && dpkg-deb -f "$FILE" Version || echo ""
      register: _suricata_version_raw
      changed_when: false
      failed_when: false

    - name: Write Suricata version file
      ansible.builtin.copy:
        content: "{{ _suricata_version_raw.stdout | trim }}\n"
        dest: "{{ artifacts_dir }}/suricata-version.txt"
        mode: '0644'
      when: _suricata_version_raw.stdout | trim | length > 0

    - name: Create Suricata debs tarball
      ansible.builtin.shell: |
        tar -czf {{ artifacts_dir }}/suricata-debs.tar.gz \
          -C {{ artifacts_dir }} suricata-debs/
      changed_when: true

    # ── RITA Docker images ────────────────────────────────────────────────────
    # RITA v5 is Docker-based (docker-compose stack, not a binary).
    # Extract the docker-compose.yml from the installer tarball, discover
    # all image references, pull and push to local registry.

    - name: Extract RITA installer for image discovery
      ansible.builtin.shell: |
        tar -xzf {{ artifacts_dir }}/rita-{{ rita_version }}.tar.gz -C /tmp
      changed_when: false

    - name: Show RITA installer file tree and env
      ansible.builtin.shell: |
        echo "=== Installer files ==="
        find /tmp/rita-{{ rita_version }}-installer -type f | sort
        echo ""
        echo "=== .env file ==="
        cat "/tmp/rita-{{ rita_version }}-installer/files/opt/.env" 2>/dev/null || echo "(no .env found)"
      changed_when: false
      register: rita_installer_tree

    - name: Display RITA installer contents
      ansible.builtin.debug:
        msg: "{{ rita_installer_tree.stdout_lines }}"

    - name: Pull and cache all RITA Docker images
      # cd to the compose dir so docker compose picks up .env automatically,
      # resolving CLICKHOUSE_VERSION. Use `docker compose config --images`
      # which returns one fully-resolved image ref per line.
      #
      # Each pull+push is retried: public registries (lscr.io/linuxserver,
      # ghcr, docker.io) intermittently reset the connection mid-transfer,
      # especially over IPv6. Without retries a single reset kills the whole
      # prep run. 'set -e' is intentionally NOT used at top level — the retry
      # helper decides success/failure per image.
      ansible.builtin.shell: |
        COMPOSE_DIR="/tmp/rita-{{ rita_version }}-installer/files/opt"
        cd "$COMPOSE_DIR"

        echo "=== Resolved images ==="
        IMAGES=$(docker compose config --images)
        echo "$IMAGES"
        echo ""

        retry() {
          local n=0 max=4
          until "$@"; do
            n=$((n + 1))
            if [ "$n" -ge "$max" ]; then
              echo "  FAILED after ${max} attempts: $*" >&2
              return 1
            fi
            echo "  retry ${n}/${max} in $((n * 5))s: $*" >&2
            sleep $((n * 5))
          done
        }

        echo "=== Pulling and caching ==="
        rc=0
        echo "$IMAGES" | sort -u | while read img; do
          [ -z "$img" ] && continue
          echo "Pulling: $img"
          LOCAL=$(echo "$img" | awk -F/ '{print $NF}')
          if retry docker pull "$img" \
             && docker tag "$img" "localhost:5000/rita/${LOCAL}" \
             && retry docker push "localhost:5000/rita/${LOCAL}"; then
            echo "Cached: localhost:5000/rita/${LOCAL}"
          else
            echo "ERROR: could not cache $img" >&2
            exit 1
          fi
        done
      changed_when: true
      register: rita_image_cache

    - name: Show RITA image cache results
      ansible.builtin.debug:
        msg: "{{ rita_image_cache.stdout_lines }}"

    # ── Suricata rules ─────────────────────────────────────────────────────────

    # Mirrors every free Suricata rule source (no auth parameters — ET Open,
    # abuse.ch SSLbl/URLhaus, OISF traffic-id, etc.) as plain per-source
    # .rules files plus a manifest.json under {{ artifacts_dir }}/suricata-sources/,
    # which nginx serves directly at {{ artifact_base_url }}/suricata-sources/.
    # The node's suricata role points suricata-update straight at those URLs
    # (roles/suricata/tasks/main.yml) instead of the real internet-facing
    # source index, so re-running this task with internet access and then
    # redeploying the suricata role is how rules get refreshed.
    - name: Download free Suricata rule sources (per-source + manifest)
      # The fetch logic lives in files/fetch_suricata_sources.py (shared with
      # check_updates.yml) and is mounted into the container.
      ansible.builtin.shell: |
        docker run --rm \
          -v {{ artifacts_dir }}:/output \
          -v {{ playbook_dir }}/../files/fetch_suricata_sources.py:/fetch.py:ro \
          ubuntu:noble \
          bash -c '
            set -e
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
              suricata suricata-update python3-yaml curl
            suricata-update update-sources
            python3 /fetch.py /output/suricata-sources
          '
      changed_when: true
      register: rules_result
      failed_when: rules_result.rc != 0

    - name: Show Suricata source download summary
      ansible.builtin.debug:
        msg: "{{ rules_result.stdout_lines | select('match', '^(OK|SKIP)') | list }}"

    # ── Warm apt-cacher-ng with standard packages ──────────────────────────────

    - name: Warm apt-cacher-ng with standard Orochi packages (full closure, clean container)
      # Same host-state bug class as the deb bundles: warming from the mgmt
      # box with --download-only fetches NOTHING for packages the mgmt box
      # already has installed or cached, so they never pass through the proxy
      # and are never cached. On the bench this is invisible (apt-cacher-ng
      # fetches on demand while the mgmt box is online); in the field with the
      # mgmt box offline, the node fails to install e.g. python3-docker. A
      # clean ubuntu:25.10 container has nothing installed, so apt resolves
      # the FULL closure and every deb transits the proxy into the cache.
      # --network host so the container reaches apt-cacher-ng on localhost.
      # NO failed_when:false — silent warming failure means a broken field
      # deployment, so this must fail loudly.
      ansible.builtin.shell: |
        set -e
        docker run --rm --network host ubuntu:25.10 bash -c '
          set -e
          export DEBIAN_FRONTEND=noninteractive
          echo "Acquire::http::Proxy \"http://localhost:{{ mgmt_apt_proxy_port }}\";" \
            > /etc/apt/apt.conf.d/01orochi-proxy
          apt-get update -qq
          apt-get install -y --download-only \
            iptables iptables-persistent netfilter-persistent \
            wireguard \
            python3-docker python3-requests python3-urllib3 \
            python3-websockets \
            software-properties-common apt-transport-https gnupg \
            ca-certificates curl
        '
      changed_when: true

    # ── Nginx artifact server ──────────────────────────────────────────────────

    - name: Start nginx artifact server
      community.docker.docker_container:
        name: orochi-artifacts
        image: "nginx:{{ portal_version }}"
        state: started
        restart_policy: unless-stopped
        ports:
          - "{{ mgmt_artifact_port }}:80"
        volumes:
          - "{{ artifacts_dir }}:/usr/share/nginx/html:ro"

    # ── Verify ─────────────────────────────────────────────────────────────────

    - name: Verify registry has expected images
      ansible.builtin.uri:
        url: "http://localhost:5000/v2/{{ item }}/tags/list"
        status_code: 200
      loop:
        - "elasticsearch/elasticsearch"
        - "kibana/kibana"
        - "elastic-agent/elastic-agent"
        - "cassandra"
        - "thehiveproject/thehive4"
        - "debian"
        - "mattermost/mattermost-team-edition"
        - "postgres"
        - "gchq/cyberchef"
        - "nginx"
        - "timesketch/timesketch"
        - "redis"
        - "arkime/arkime"
      loop_control:
        label: "{{ item }}"

    - name: Verify RITA images are in the registry
      ansible.builtin.uri:
        url: "http://localhost:5000/v2/_catalog?n=200"
        return_content: true
        status_code: 200
      register: _registry_catalog
      failed_when: >-
        (_registry_catalog.json.repositories | default([])
         | select('match', '^rita/') | list | length) == 0

    - name: Verify binary artifacts exist
      ansible.builtin.stat:
        path: "{{ artifacts_dir }}/{{ item }}"
      register: artifact_stat
      failed_when: not artifact_stat.stat.exists
      loop:
        - "velociraptor-linux-amd64"
        - "velociraptor-version.txt"
        - "zeek-version.txt"
        - "suricata-version.txt"
        - "rita-version.txt"
        - "rita-{{ rita_version }}.tar.gz"
        - "elastic-artifacts/manifest.json"
        - "elastic-artifacts/beats/elastic-agent/{{ elastic_agent_artifacts | first }}"
        - "docker-debs.tar.gz"
        - "zeek-debs.tar.gz"
        - "suricata-debs.tar.gz"
        - "suricata-sources/manifest.json"
        - "zeek-release.key"
      loop_control:
        label: "{{ item }}"

    - name: Artefact prep complete
      ansible.builtin.debug:
        msg:
          - "============================================"
          - "All artefacts downloaded and cached."
          - ""
          - "Local registry:    localhost:5000"
          - "Artifact server:   http://localhost:{{ mgmt_artifact_port }}"
          - "Apt proxy:         localhost:{{ mgmt_apt_proxy_port }}"
          - ""
          - "Management box is ready for offline deployment."
          - "You can now disconnect from the internet."
          - "============================================"
