---
# Usage: ansible-playbook prep_for_battle.yml -e "proxmox_ip=192.168.0.200 proxmox_password=yourpassword"

- name: Generate SSH key on management laptop
  hosts: localhost
  gather_facts: false
  vars_prompt:
    - name: case_reference
      prompt: "Case reference (e.g. OP KRAKEN)"
      private: false

    - name: common_password
      prompt: "Common password for all services"
      private: true
      confirm: true

    - name: target_network_cidr
      prompt: "Target network CIDR (e.g. 192.168.1.0/24)"
      private: false

  tasks:
    - name: Generate SSH key pair
      community.crypto.openssh_keypair:
        path: ~/.ssh/orochi_id_ed25519
        type: ed25519
        comment: orochi-management
        force: false

    - name: Write engagement vars to terraform.tfvars
      lineinfile:
        path: "{{ playbook_dir }}/../../terraform/terraform.tfvars"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        create: true
      loop:
        - { regexp: '^case_reference',      line: 'case_reference = "{{ case_reference }}"' }
        - { regexp: '^common_password',     line: 'common_password = "{{ common_password }}"' }
        - { regexp: '^target_network_cidr', line: 'target_network_cidr = "{{ target_network_cidr }}"' }
        - { regexp: '^proxmox_endpoint',    line: 'proxmox_endpoint = "https://{{ proxmox_ip }}:8006"' }
        - { regexp: '^proxmox_ssh_user',    line: 'proxmox_ssh_user = "root"' }
        - { regexp: '^proxmox_node',        line: 'proxmox_node = "home"' }
        - { regexp: '^ssh_public_key',      line: 'ssh_public_key = "{{ lookup("file", "~/.ssh/orochi_id_ed25519.pub") }}"' }

    - name: Add Proxmox host to inventory
      add_host:
        name: "{{ proxmox_ip }}"
        groups: proxmox_bootstrap
        ansible_user: root
        ansible_password: "{{ proxmox_password }}"
        ansible_ssh_extra_args: "-o StrictHostKeyChecking=no"

- name: Bootstrap Proxmox host
  hosts: proxmox_bootstrap
  gather_facts: false
  tasks:
    - name: Push SSH public key
      ansible.posix.authorized_key:
        user: root
        key: "{{ lookup('file', '~/.ssh/orochi_id_ed25519.pub') }}"

    - name: Create TerraformRole
      shell: >
        pveum role list --output-format json | grep -q TerraformRole ||
        pveum role add TerraformRole -privs
        'Datastore.AllocateSpace Datastore.AllocateTemplate Datastore.Audit
        Pool.Allocate Pool.Audit SDN.Use Sys.Audit Sys.Console Sys.Modify
        User.Modify VM.Allocate VM.Audit VM.Clone VM.Config.CDROM
        VM.Config.Cloudinit VM.Config.CPU VM.Config.Disk VM.Config.HWType
        VM.Config.Memory VM.Config.Network VM.Config.Options VM.Migrate VM.PowerMgmt'

    - name: Create terraform@pve user
      shell: >
        pveum user list --output-format json | grep -q terraform@pve ||
        pveum user add terraform@pve --comment "Terraform provisioner"

    - name: Assign role to terraform user
      command: pveum acl modify / --roles TerraformRole --user terraform@pve

    - name: Remove existing API token if present
      command: pveum user token remove terraform@pve terraform
      register: token_remove
      failed_when: token_remove.rc != 0 and 'does not exist' not in token_remove.stderr

    - name: Create API token
      command: pveum user token add terraform@pve terraform --privsep=0 --output-format json
      register: token_raw

    - name: Extract token value
      set_fact:
        api_token: "terraform@pve!terraform={{ (token_raw.stdout | from_json).value }}"

    - name: Write Proxmox credentials to terraform.tfvars
      delegate_to: localhost
      lineinfile:
        path: "{{ playbook_dir }}/../../terraform/terraform.tfvars"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^proxmox_api_token',   line: 'proxmox_api_token = "{{ api_token }}"' }
        - { regexp: '^proxmox_ssh_password', line: 'proxmox_ssh_password = "{{ proxmox_password }}"' }

    - name: Done
      debug:
        msg: "Proxmox is ready. terraform.tfvars is complete. Run terraform next."
