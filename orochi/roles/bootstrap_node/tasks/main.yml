---
# Configures the Orochi node to use the management box as its
# artifact source before any packages or images are installed.
# Must run before any other role.

# ── Management box IP ─────────────────────────────────────────────────────────
# The orochi node uses this IP for apt proxy, Docker registry, and artifact
# server. Under DHCP or Tailscale the IP changes between sessions, so we
# resolve it here and persist it in .env for re-runs.

- name: Read MGMT_BOX_IP from .env if present
  ansible.builtin.shell: |
    grep '^MGMT_BOX_IP=' {{ playbook_dir }}/.env 2>/dev/null | cut -d= -f2 || true
  register: _saved_mgmt_ip
  delegate_to: localhost
  become: false
  changed_when: false

- name: Use saved mgmt_box_ip from .env
  ansible.builtin.set_fact:
    mgmt_box_ip: "{{ _saved_mgmt_ip.stdout | trim }}"
  when: _saved_mgmt_ip.stdout | trim | length > 0

- name: List management box network addresses
  ansible.builtin.shell: |
    counter=1
    ip -o -4 addr show | while read line; do
      iface=$(echo "$line" | awk '{print $2}')
      ip=$(echo "$line" | awk '{print $4}' | cut -d'/' -f1)
      case "$iface" in
        lo|docker*|br-*|veth*) continue ;;
      esac
      echo "${counter}. ${iface}  ${ip}"
      counter=$((counter + 1))
    done
  register: _mgmt_iface_display
  delegate_to: localhost
  become: false
  changed_when: false
  when: _saved_mgmt_ip.stdout | trim | length == 0

- name: Build management box IP lookup table
  ansible.builtin.shell: |
    ip -o -4 addr show | while read line; do
      iface=$(echo "$line" | awk '{print $2}')
      ip=$(echo "$line" | awk '{print $4}' | cut -d'/' -f1)
      case "$iface" in
        lo|docker*|br-*|veth*) continue ;;
      esac
      echo "$ip"
    done
  register: _mgmt_ip_list
  delegate_to: localhost
  become: false
  changed_when: false
  when: _saved_mgmt_ip.stdout | trim | length == 0

- name: Show management box addresses
  ansible.builtin.debug:
    msg:
      - "Select the IP address the orochi node should use to reach this management box:"
      - "{{ _mgmt_iface_display.stdout_lines | default([]) }}"
  when: _saved_mgmt_ip.stdout | trim | length == 0

- name: Prompt for management box IP
  ansible.builtin.pause:
    prompt: "Enter number or IP address [{{ mgmt_box_ip }}]"
    echo: yes
  register: _mgmt_ip_input
  when: _saved_mgmt_ip.stdout | trim | length == 0

- name: Set mgmt_box_ip from selection
  ansible.builtin.set_fact:
    mgmt_box_ip: >-
      {%- set inp = _mgmt_ip_input.user_input | default('') | trim -%}
      {%- if inp | regex_search('^[0-9]+$') -%}
        {{ _mgmt_ip_list.stdout_lines[inp | int - 1] | default(mgmt_box_ip) }}
      {%- elif inp | length > 0 -%}
        {{ inp }}
      {%- else -%}
        {{ mgmt_box_ip }}
      {%- endif -%}
  when: _saved_mgmt_ip.stdout | trim | length == 0

- name: Confirm selected management box IP
  ansible.builtin.debug:
    msg: "Management box: {{ mgmt_box_ip }}"

- name: Share resolved mgmt_box_ip with the control node
  # Later plays (Arkime remote capture) read hostvars['localhost']['mgmt_box_ip'].
  # Without this, they silently fall back to the group_vars default.
  ansible.builtin.set_fact:
    mgmt_box_ip: "{{ mgmt_box_ip }}"
  delegate_to: localhost
  delegate_facts: true

- name: Persist MGMT_BOX_IP to .env for re-runs
  ansible.builtin.lineinfile:
    path: "{{ playbook_dir }}/.env"
    regexp: '^MGMT_BOX_IP='
    line: "MGMT_BOX_IP={{ mgmt_box_ip }}"
    create: true
    mode: '0600'
  delegate_to: localhost
  become: false

# ── Verify reachability ───────────────────────────────────────────────────────

- name: Verify management box is reachable
  ansible.builtin.wait_for:
    host: "{{ mgmt_box_ip }}"
    port: "{{ mgmt_artifact_port }}"
    timeout: 10
  failed_when: false
  register: mgmt_reachable

- name: Fail if management box artifact server is not reachable
  ansible.builtin.fail:
    msg: >
      Management box artifact server not reachable at
      {{ mgmt_box_ip }}:{{ mgmt_artifact_port }}.
      Ensure setup_mgmt_box.yml and prep_artefacts.yml have been run.
  when: mgmt_reachable.failed | default(false)

# ── apt proxy ─────────────────────────────────────────────────────────────────

- name: Configure apt to use management box as proxy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/01orochi-proxy
    content: |
      Acquire::http::Proxy "http://{{ mgmt_box_ip }}:{{ mgmt_apt_proxy_port }}";
      Acquire::https::Proxy "DIRECT";
    mode: '0644'
    owner: root
    group: root
