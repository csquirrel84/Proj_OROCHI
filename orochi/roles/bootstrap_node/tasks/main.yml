---
# Configures the Orochi node to use the management box as its
# artifact source before any packages or images are installed.
# Must run before any other role.

- name: Verify management box is reachable
  ansible.builtin.wait_for:
    host: "{{ mgmt_box_ip }}"
    port: "{{ mgmt_artifact_port }}"
    timeout: 10
  failed_when: false
  register: mgmt_reachable

- name: Fail if management box artifact server is not reachable
  ansible.builtin.fail:
    msg: >
      Management box artifact server not reachable at
      {{ mgmt_box_ip }}:{{ mgmt_artifact_port }}.
      Ensure setup_mgmt_box.yml and prep_artefacts.yml have been run.
  when: mgmt_reachable.failed | default(false)

# ── apt proxy ─────────────────────────────────────────────────────────────────

- name: Configure apt to use management box as proxy
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/01orochi-proxy
    content: |
      Acquire::http::Proxy "http://{{ mgmt_box_ip }}:{{ mgmt_apt_proxy_port }}";
      Acquire::https::Proxy "DIRECT";
    mode: '0644'
    owner: root
    group: root

# ── NIC discovery — resolve interface names from MAC addresses ─────────────────
# Interface kernel names change between hardware and kernel versions.
# We discover them once here from MACs and cache them as facts for all roles.

- name: Discover analyst NIC name from MAC
  ansible.builtin.shell: |
    ip link | grep -B1 '{{ analyst_nic_mac }}' | head -1 | awk -F': ' '{print $2}' | tr -d ' '
  register: _discovered_analyst_nic
  changed_when: false
  failed_when: _discovered_analyst_nic.stdout | length == 0

- name: Discover capture NIC name from MAC
  ansible.builtin.shell: |
    ip link | grep -B1 '{{ target_nic_mac }}' | head -1 | awk -F': ' '{print $2}' | tr -d ' '
  register: _discovered_capture_nic
  changed_when: false
  failed_when: _discovered_capture_nic.stdout | length == 0

- name: Set NIC facts for use by all roles
  ansible.builtin.set_fact:
    nic_analyst: "{{ _discovered_analyst_nic.stdout | trim }}"
    capture_interface: "{{ _discovered_capture_nic.stdout | trim }}"
    cacheable: true

- name: Report discovered interfaces
  ansible.builtin.debug:
    msg:
      - "Analyst NIC:   {{ nic_analyst }}  (MAC {{ analyst_nic_mac }})"
      - "Capture NIC:   {{ capture_interface }}  (MAC {{ target_nic_mac }})"
