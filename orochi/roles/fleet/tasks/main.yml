---
# ==============================================
# FLEET SERVER ROLE
# ==============================================

- name: Create Fleet Server directories
  ansible.builtin.file:
    path: "{{ directories.fleet }}"
    state: directory
    mode: '0770'
    owner: 1000
    group: 1000
  tags: fleet

- name: Wait for Kibana Fleet API
  ansible.builtin.uri:
    url: "https://localhost:{{ ports.kibana }}/api/fleet/agents/setup"
    method: GET
    user: elastic
    password: "{{ elasticsearch_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
    validate_certs: false
    status_code: [200]
  register: fleet_api_ready
  until: fleet_api_ready.status == 200
  retries: 30
  delay: 10
  tags: fleet

# Create Fleet Server Policy
- name: Check if fleet-server-policy exists
  ansible.builtin.uri:
    url: "https://localhost:{{ ports.kibana }}/api/fleet/agent_policies/fleet-server-policy"
    method: GET
    user: elastic
    password: "{{ elasticsearch_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
    validate_certs: false
    status_code: [200, 404]
  register: fleet_policy_check
  tags: fleet

- name: Create Fleet Server policy
  ansible.builtin.uri:
    url: "https://localhost:{{ ports.kibana }}/api/fleet/agent_policies"
    method: POST
    user: elastic
    password: "{{ elasticsearch_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
      Content-Type: "application/json"
    body_format: json
    body:
      id: "fleet-server-policy"
      name: "Fleet Server Policy"
      namespace: "default"
      monitoring_enabled:
        - logs
        - metrics
      has_fleet_server: true
    validate_certs: false
    status_code: [200, 201]
  when: fleet_policy_check.status == 404
  tags: fleet

# Get fleet_server package version
- name: Get fleet_server package info
  ansible.builtin.uri:
    url: "https://localhost:{{ ports.kibana }}/api/fleet/epm/packages/fleet_server"
    method: GET
    user: elastic
    password: "{{ elasticsearch_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
    validate_certs: false
    status_code: [200]
  register: fleet_server_package
  tags: fleet

- name: Set fleet_server package version
  ansible.builtin.set_fact:
    fleet_server_version: "{{ fleet_server_package.json.item.version }}"
  tags: fleet

# Check if Fleet Server integration exists
- name: Get all package policies
  ansible.builtin.uri:
    url: "https://localhost:{{ ports.kibana }}/api/fleet/package_policies"
    method: GET
    user: elastic
    password: "{{ elasticsearch_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
    validate_certs: false
    status_code: [200]
  register: all_package_policies
  tags: fleet

- name: Check if Fleet Server integration exists
  ansible.builtin.set_fact:
    # FIXED: Use ['items'] instead of .items to avoid conflict with python dict method
    fleet_server_integration_exists: "{{ all_package_policies.json['items'] | selectattr('policy_id', 'equalto', 'fleet-server-policy') | selectattr('package.name', 'equalto', 'fleet_server') | list | length > 0 }}"
  tags: fleet

- name: Add Fleet Server integration to policy
  ansible.builtin.uri:
    url: "https://localhost:{{ ports.kibana }}/api/fleet/package_policies"
    method: POST
    user: elastic
    password: "{{ elasticsearch_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "fleet-server-integration"
      namespace: "default"
      policy_id: "fleet-server-policy"
      enabled: true
      inputs:
        - type: "fleet-server"
          enabled: true
          streams: []
          vars:
            host:
              value: "0.0.0.0"
              type: "text"
            port:
              value: 8220
              type: "integer"
      package:
        name: "fleet_server"
        version: "{{ fleet_server_version }}"
    validate_certs: false
    status_code: [200, 201]
  when: not fleet_server_integration_exists
  tags: fleet

# Configure Fleet Server hosts
- name: Get existing Fleet Server hosts
  ansible.builtin.uri:
    url: "https://localhost:{{ ports.kibana }}/api/fleet/fleet_server_hosts"
    method: GET
    user: elastic
    password: "{{ elasticsearch_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
    validate_certs: false
    status_code: [200]
  register: fleet_server_hosts
  tags: fleet

- name: Create Fleet Server host configuration
  ansible.builtin.uri:
    url: "https://localhost:{{ ports.kibana }}/api/fleet/fleet_server_hosts"
    method: POST
    user: elastic
    password: "{{ elasticsearch_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "Default Fleet Server"
      host_urls:
        - "https://{{ orochi_server_ip }}:{{ ports.fleet }}"
      is_default: true
    validate_certs: false
    status_code: [200, 201]
  when: fleet_server_hosts.json.total == 0
  tags: fleet

- name: Update Fleet Server host configuration
  ansible.builtin.uri:
    url: "https://localhost:{{ ports.kibana }}/api/fleet/fleet_server_hosts/{{ fleet_server_hosts.json['items'][0].id }}"
    method: PUT
    user: elastic
    password: "{{ elasticsearch_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "Default Fleet Server"
      host_urls:
        - "https://{{ orochi_server_ip }}:{{ ports.fleet }}"
      is_default: true
    validate_certs: false
    status_code: [200]
  when: fleet_server_hosts.json.total > 0
  tags: fleet

# Configure Fleet output
- name: Get existing outputs
  ansible.builtin.uri:
    url: "https://localhost:{{ ports.kibana }}/api/fleet/outputs"
    method: GET
    user: elastic
    password: "{{ elasticsearch_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
    validate_certs: false
    status_code: [200]
  register: fleet_outputs
  tags: fleet

- name: Update Fleet default output
  ansible.builtin.uri:
    url: "https://localhost:{{ ports.kibana }}/api/fleet/outputs/{{ fleet_outputs.json['items'][0].id }}"
    method: PUT
    user: elastic
    password: "{{ elasticsearch_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
      Content-Type: "application/json"
    body_format: json
    body:
      hosts:
        - "https://{{ orochi_server_ip }}:{{ ports.elasticsearch }}"
      ca_trusted_fingerprint: "{{ ca_fingerprint }}"
      ssl:
        certificate_authorities:
          - "{{ ca_certificate }}"
    validate_certs: false
    status_code: [200]
  when: fleet_outputs.json.total > 0
  tags: fleet

# Start Fleet Server Container
- name: Pull Elastic Agent image
  community.docker.docker_image:
    name: "{{ images.elastic_agent }}"
    source: pull
  tags: fleet

- name: Start Fleet Server container
  community.docker.docker_container:
    # timeout raised from the 60s default: this container bind-mounts the
    # whole root fs (/:/hostfs), /proc, /sys/fs/cgroup and the docker
    # containers dir. Setting those up while ES/Kibana/Cassandra are doing
    # heavy first-start I/O can exceed 60s and trip a docker API read timeout.
    timeout: 300
    name: fleet-server
    image: "{{ images.elastic_agent }}"
    state: started
    restart_policy: unless-stopped
    user: root
    hostname: fleet-server
    networks:
      - name: "{{ orochi_network_name }}"
    ports:
      - "{{ ports.fleet }}:8220"
    volumes:
      - "{{ directories.certs }}:/certs:ro"
      - "{{ directories.fleet }}:/usr/share/elastic-agent/state"
      - "/var/lib/docker/containers:/var/lib/docker/containers:ro"
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "/sys/fs/cgroup:/hostfs/sys/fs/cgroup:ro"
      - "/proc:/hostfs/proc:ro"
      - "/:/hostfs:ro"
    env:
      FLEET_SERVER_ENABLE: "1"
      FLEET_SERVER_POLICY_ID: "fleet-server-policy"
      FLEET_SERVER_ELASTICSEARCH_HOST: "https://elasticsearch:9200"
      FLEET_SERVER_ELASTICSEARCH_USERNAME: "elastic"
      FLEET_SERVER_ELASTICSEARCH_PASSWORD: "{{ elasticsearch_password }}"
      FLEET_SERVER_ELASTICSEARCH_CA: "/certs/ca/ca.crt"
      FLEET_SERVER_CERT: "/certs/fleet-server/fleet-server.crt"
      FLEET_SERVER_CERT_KEY: "/certs/fleet-server/fleet-server.key"
      FLEET_URL: "https://fleet-server:8220"
      FLEET_CA: "/certs/ca/ca.crt"
      KIBANA_HOST: "https://kibana:5601"
      KIBANA_FLEET_SETUP: "1"
      KIBANA_FLEET_USERNAME: "elastic"
      KIBANA_FLEET_PASSWORD: "{{ elasticsearch_password }}"
      KIBANA_FLEET_CA: "/certs/ca/ca.crt"
  tags: fleet

- name: Wait for Fleet Server to be available
  ansible.builtin.wait_for:
    host: localhost
    port: "{{ ports.fleet }}"
    delay: 10
    timeout: 120
  tags: fleet

- name: Wait for Fleet Server to be healthy
  ansible.builtin.uri:
    url: "https://localhost:{{ ports.fleet }}/api/status"
    method: GET
    validate_certs: false
    status_code: [200]
  register: fleet_server_status
  until:
    - fleet_server_status.status == 200
    - fleet_server_status.json.status == "HEALTHY"
  retries: 30
  delay: 10
  ignore_errors: true
  tags: fleet

# ══════════════════════════════════════════════════════════════════════════════
# NODE-HOSTED ELASTIC ARTIFACT REGISTRY
# ══════════════════════════════════════════════════════════════════════════════
# Kibana's enrolment snippet defaults to downloading the installer from
# artifacts.elastic.co — unreachable from an air-gapped target network, so the
# copy-paste command fails at the first line. The node therefore serves its own
# artifact registry, mirroring the exact upstream layout
# (<host>/beats/elastic-agent/<file>), and registers it with Fleet as the
# DEFAULT agent binary download source.
#
# That registration governs agent UPGRADES issued from Fleet (documented
# behaviour). Whether the Kibana "Add agent" flyout rewrites its displayed
# install command from this setting is version-dependent — it was an open
# Kibana enhancement request (elastic/kibana#164475), so DO NOT rely on it:
# the final task below prints known-good install commands pointing at the node,
# and those are what an operator should copy.

- name: Create Elastic Agent artifact registry directory on the node
  ansible.builtin.file:
    path: "{{ directories.agent_artifacts }}/beats/elastic-agent"
    state: directory
    mode: '0755'
  tags: fleet

- name: Fetch Elastic Agent artifact manifest from the management box
  ansible.builtin.uri:
    url: "{{ artifact_base_url }}/elastic-artifacts/manifest.json"
    return_content: true
    status_code: [200, 404]
  register: _ea_manifest
  tags: fleet

- name: Warn if the management box has no Elastic Agent artifact mirror
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ artifact_base_url }}/elastic-artifacts/manifest.json not
      found — the node cannot host agent installers. Re-run
      prep_artefacts.yml on the management box. Enrolment will still work,
      but endpoints must obtain the installer by some other means.
  when: _ea_manifest.status != 200
  tags: fleet

- name: Check free space before mirroring Elastic Agent packages to the node
  # The full 9.x set is ~10-12 GB. Running out of disk mid-mirror leaves
  # truncated installers that endpoints would download and fail to extract,
  # so refuse up front rather than corrupt the registry.
  ansible.builtin.shell: |
    df -BG --output=avail {{ orochi_base_path }} | tail -1 | tr -dc '0-9'
  register: _ea_node_free_gb
  changed_when: false
  when: _ea_manifest.status == 200
  tags: fleet

- name: Fail if the node is short on disk for the agent mirror
  ansible.builtin.fail:
    msg: >-
      Only {{ _ea_node_free_gb.stdout }} GB free at {{ orochi_base_path }} on
      the node — need at least {{ elastic_agent_mirror_min_free_gb }} GB to
      mirror {{ (_ea_manifest.content | from_json) | length }} Elastic Agent
      packages. Free space on the node, or reduce the mirrored set via
      elastic_agent_artifacts / elastic_agent_package_types in
      group_vars/all.yml and re-run prep_artefacts.yml.
  when:
    - _ea_manifest.status == 200
    - (_ea_node_free_gb.stdout | int) < (elastic_agent_mirror_min_free_gb | int)
  tags: fleet

- name: Mirror Elastic Agent installers to the node
  # force: false — version-pinned filenames cannot go stale, and these are
  # ~1 GB each. Runs over the LAN from the management box, never the internet.
  ansible.builtin.get_url:
    url: "{{ artifact_base_url }}/elastic-artifacts/beats/elastic-agent/{{ item.0 }}{{ item.1 }}"
    dest: "{{ directories.agent_artifacts }}/beats/elastic-agent/{{ item.0 }}{{ item.1 }}"
    mode: '0644'
    force: false
    timeout: 120
  loop: "{{ (_ea_manifest.content | from_json) | product(['', '.sha512', '.asc']) | list }}"
  loop_control:
    label: "{{ item.0 }}{{ item.1 }}"
  when: _ea_manifest.status == 200
  tags: fleet

# Same reasoning as the management box: version-pinned filenames + force:false
# means superseded packages would accumulate on the node forever. Prunes only
# after the current set has mirrored successfully.
- name: Find files currently in the node Elastic Agent mirror
  ansible.builtin.find:
    paths: "{{ directories.agent_artifacts }}/beats/elastic-agent"
    patterns: "*"
  register: _ea_node_present
  when: _ea_manifest.status == 200
  tags: fleet

- name: Prune Elastic Agent packages from superseded versions on the node
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _ea_node_present.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - _ea_manifest.status == 200
    - (item.path | basename) not in ((_ea_manifest.content | from_json) | product(['', '.sha512', '.asc']) | map('join') | list)
  tags: fleet

- name: Start Elastic Agent artifact registry container
  # Plain nginx autoindex over the mirrored tree. Bound to the analyst NIC and
  # the capture NIC alike: endpoints being enrolled live on the monitored
  # network and must be able to reach it. HTTP, not HTTPS — agent installers
  # are integrity-checked via .sha512/.asc, and a self-signed cert here would
  # simply break the download for every endpoint.
  community.docker.docker_container:
    name: elastic-artifacts
    image: "{{ images.nginx }}"
    state: started
    restart_policy: unless-stopped
    hostname: elastic-artifacts
    networks:
      - name: "{{ orochi_network_name }}"
    ports:
      - "{{ ports.agent_artifacts }}:80"
    volumes:
      - "{{ directories.agent_artifacts }}:/usr/share/nginx/html:ro"
  when: _ea_manifest.status == 200
  tags: fleet

- name: Get existing agent binary download sources
  ansible.builtin.uri:
    url: "https://localhost:{{ ports.kibana }}/api/fleet/agent_download_sources"
    method: GET
    user: elastic
    password: "{{ elasticsearch_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
    validate_certs: false
    status_code: [200]
  register: _ea_sources
  when: _ea_manifest.status == 200
  tags: fleet

- name: Find any previously registered OROCHI download source
  ansible.builtin.set_fact:
    _ea_existing: "{{ (_ea_sources.json['items'] | default([]) | selectattr('name', 'equalto', 'OROCHI local artifact registry') | list | first) | default({}) }}"
  when: _ea_manifest.status == 200
  tags: fleet

- name: Register the node as the default agent binary download source
  ansible.builtin.uri:
    url: "https://localhost:{{ ports.kibana }}/api/fleet/agent_download_sources"
    method: POST
    user: elastic
    password: "{{ elasticsearch_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "OROCHI local artifact registry"
      host: "http://{{ orochi_server_ip }}:{{ ports.agent_artifacts }}/"
      is_default: true
    validate_certs: false
    status_code: [200, 201]
  when:
    - _ea_manifest.status == 200
    - _ea_existing | length == 0
  tags: fleet

- name: Update the OROCHI agent binary download source
  # Keeps the host current if the node IP changed since the last deploy.
  ansible.builtin.uri:
    url: "https://localhost:{{ ports.kibana }}/api/fleet/agent_download_sources/{{ _ea_existing.id }}"
    method: PUT
    user: elastic
    password: "{{ elasticsearch_password }}"
    force_basic_auth: true
    headers:
      kbn-xsrf: "true"
      Content-Type: "application/json"
    body_format: json
    body:
      name: "OROCHI local artifact registry"
      host: "http://{{ orochi_server_ip }}:{{ ports.agent_artifacts }}/"
      is_default: true
    validate_certs: false
    status_code: [200]
  when:
    - _ea_manifest.status == 200
    - _ea_existing | length > 0
  tags: fleet

- name: Display Fleet Server status
  ansible.builtin.debug:
    msg: "{{ _fleet_status_msg.split('\n') }}"
  vars:
    _fleet_status_msg: |-
      Fleet Server is running!
      URL: https://{{ orochi_server_ip }}:{{ ports.fleet }}
      Kibana Fleet: https://{{ orochi_server_ip }}:{{ ports.kibana }}/app/fleet
      Status: {{ fleet_server_status.json.status | default('Starting...') }}

      Agent installers are served from this node at:
        http://{{ orochi_server_ip }}:{{ ports.agent_artifacts }}/beats/elastic-agent/

      Registered with Fleet as the DEFAULT agent binary download source, so
      Fleet-issued agent upgrades pull from the node, not the internet.

      NOTE: Kibana's "Add agent" flyout may still DISPLAY an
      artifacts.elastic.co URL — that download will fail on an air-gapped
      endpoint. Use the commands below instead; take the --enrollment-token
      from the Kibana flyout.

      Windows (PowerShell, as Administrator):
        $ProgressPreference = 'SilentlyContinue'
        Invoke-WebRequest -Uri http://{{ orochi_server_ip }}:{{ ports.agent_artifacts }}/beats/elastic-agent/elastic-agent-{{ stack_version }}-windows-x86_64.zip -OutFile elastic-agent.zip
        Expand-Archive .\elastic-agent.zip -DestinationPath .
        cd elastic-agent-{{ stack_version }}-windows-x86_64
        .\elastic-agent.exe install --url=https://{{ orochi_server_ip }}:{{ ports.fleet }} --enrollment-token=<TOKEN> --insecure

      Linux (as root):
        curl -O http://{{ orochi_server_ip }}:{{ ports.agent_artifacts }}/beats/elastic-agent/elastic-agent-{{ stack_version }}-linux-x86_64.tar.gz
        tar xzvf elastic-agent-{{ stack_version }}-linux-x86_64.tar.gz
        cd elastic-agent-{{ stack_version }}-linux-x86_64
        ./elastic-agent install --url=https://{{ orochi_server_ip }}:{{ ports.fleet }} --enrollment-token=<TOKEN> --insecure

      (--insecure accepts the node's self-signed Fleet certificate. To verify
      properly instead, ship the OROCHI CA to the endpoint and use
      --certificate-authorities=<path-to-ca.crt>.)
  tags: fleet