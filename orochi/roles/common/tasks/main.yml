---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-docker
      - python3-requests
      - python3-urllib3
    state: present

# ── Docker install from pre-cached packages ────────────────────────────────────

- name: Check if Docker is installed
  ansible.builtin.command: docker --version
  register: docker_check
  ignore_errors: true
  changed_when: false

- name: Install Docker from artifact server
  when: docker_check.rc != 0
  block:
    - name: Clean any previous Docker deb extraction
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /tmp/docker-debs
        - /tmp/docker-debs.tar.gz

    - name: Download Docker debs tarball from artifact server
      ansible.builtin.get_url:
        url: "{{ artifact_base_url }}/docker-debs.tar.gz"
        dest: /tmp/docker-debs.tar.gz
        mode: '0644'

    - name: Extract Docker debs
      ansible.builtin.unarchive:
        src: /tmp/docker-debs.tar.gz
        dest: /tmp
        remote_src: true

    - name: Find Docker deb files
      ansible.builtin.find:
        paths: /tmp/docker-debs
        patterns: "*.deb"
        recurse: true
      register: docker_deb_files

    - name: Install Docker packages
      ansible.builtin.shell: |
        apt-get install -y {{ docker_deb_files.files | map(attribute='path') | join(' ') }}
      register: docker_install
      changed_when: "'Setting up' in docker_install.stdout"
      when: docker_deb_files.matched > 0

    - name: Fail if no Docker deb files found
      ansible.builtin.fail:
        msg: >
          No .deb files found in /tmp/docker-debs (searched recursively).
          Check the docker-debs.tar.gz tarball on the artifact server.
      when: docker_deb_files.matched == 0

- name: Configure Docker daemon to trust local registry
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: |
      {
        "insecure-registries": ["{{ mgmt_box_ip }}:{{ mgmt_registry_port }}"]
      }
    mode: '0644'

- name: Ensure Docker is running
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Check if Docker daemon has insecure registry active
  ansible.builtin.shell: |
    docker info 2>/dev/null | grep -q "{{ mgmt_box_ip }}:{{ mgmt_registry_port }}" && echo "configured" || echo "needs_restart"
  register: _docker_registry_check
  changed_when: false

- name: Restart Docker daemon to load insecure registry config
  ansible.builtin.systemd:
    name: docker
    state: restarted
    daemon_reload: true
  when: _docker_registry_check.stdout | trim == "needs_restart"

- name: Install Python Docker SDK
  ansible.builtin.apt:
    name:
      - python3-docker
      - python3-requests
      - python3-urllib3
    state: present

# ── Docker network ─────────────────────────────────────────────────────────────

- name: Create Orochi Docker network
  community.docker.docker_network:
    name: "{{ orochi_network_name }}"
    state: present

# ── Base directories ───────────────────────────────────────────────────────────

- name: Create base directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - "{{ orochi_base_path }}"
    - "{{ directories.logs }}"

# ── Elasticsearch kernel tuning ────────────────────────────────────────────────

- name: Set vm.max_map_count for Elasticsearch
  ansible.posix.sysctl:
    name: vm.max_map_count
    value: '262144'
    state: present
    reload: true
