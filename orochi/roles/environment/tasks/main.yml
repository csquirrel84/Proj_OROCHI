---
# ==============================================
# ENVIRONMENT ROLE - Final Production Version
# ==============================================

# 1. CHECK FOR EXISTING CONFIG (on control node)
- name: Check if .env file already exists on control node
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/.env"
  register: env_file_exists
  delegate_to: localhost
  become: false
  tags: environment

- name: Read existing .env for display
  # Secrets (Arkime HMAC secret, Kibana encryption key) are filtered out so
  # they never appear on screen or in install.log.
  ansible.builtin.shell: |
    grep -vE '^(ARKIME_PASSWORD_SECRET|KIBANA_ENCRYPTION_KEY)=' {{ playbook_dir }}/.env
  register: _env_preview
  delegate_to: localhost
  become: false
  changed_when: false
  when: env_file_exists.stat.exists
  tags: environment

- name: Display existing configuration
  ansible.builtin.debug:
    msg: "{{ _env_preview.stdout_lines }}"
  when: env_file_exists.stat.exists
  tags: environment

- name: Prompt to use existing config
  ansible.builtin.pause:
    prompt: "Use this configuration? (y/n) [y]"
    echo: yes
  register: use_existing_env
  when: env_file_exists.stat.exists
  tags: environment

- name: Load existing .env variables from control node
  ansible.builtin.command: cat {{ playbook_dir }}/.env
  register: existing_env
  delegate_to: localhost
  become: false
  when:
    - env_file_exists.stat.exists
    - use_existing_env.user_input | default('y', true) | lower in ['y', 'yes', '']
  changed_when: false
  tags: environment

- name: Parse existing configuration
  ansible.builtin.set_fact:
    stack_version: "{{ existing_env.stdout | regex_search('STACK_VERSION=(.+)', '\\1') | first | default(stack_version, true) }}"
    cluster_name: "{{ existing_env.stdout | regex_search('CLUSTER_NAME=(.+)', '\\1') | first | default('orochi', true) }}"
    license: "{{ existing_env.stdout | regex_search('LICENSE=(.+)', '\\1') | first | default('basic', true) }}"
    mem_limit: "{{ existing_env.stdout | regex_search('MEM_LIMIT=(.+)', '\\1') | first | default('4g', true) }}"
    velox_user: "{{ existing_env.stdout | regex_search('VELOX_USER=(.+)', '\\1') | first | default('admin', true) }}"
    suricata_interface: "{{ existing_env.stdout | regex_search('SURICATA_INTERFACE=(.+)', '\\1') | first | default('eth0', true) }}"
    suricata_home_net: "{{ existing_env.stdout | regex_search('SURICATA_HOME_NET=(.+)', '\\1') | first | default('192.168.0.0/16', true) }}"
    mgmt_box_ip: "{{ existing_env.stdout | regex_search('MGMT_BOX_IP=(.+)', '\\1') | first | default(mgmt_box_ip, true) }}"
    orochi_node_ip: "{{ existing_env.stdout | regex_search('OROCHI_NODE_IP=(.+)', '\\1') | first | default(ansible_host, true) }}"
    arkime_version: "{{ existing_env.stdout | regex_search('ARKIME_VERSION=(.+)', '\\1') | first | default(arkime_version, true) }}"
    skip_env_prompts: true
  when:
    - env_file_exists.stat.exists
    - use_existing_env.user_input | default('y', true) | lower in ['y', 'yes', '']
  tags: environment

# Secrets are reused from .env regardless of whether the rest of the config
# is reused. Regenerating the Arkime password secret invalidates every
# existing Arkime user hash; regenerating the Kibana key invalidates
# encrypted saved objects.
- name: Read secrets from existing .env
  ansible.builtin.command: cat {{ playbook_dir }}/.env
  register: _env_secrets_raw
  delegate_to: localhost
  become: false
  changed_when: false
  when: env_file_exists.stat.exists
  no_log: true
  tags: environment

- name: Reuse persistent secrets from existing .env
  ansible.builtin.set_fact:
    arkime_password_secret: "{{ _env_secrets_raw.stdout | regex_search('ARKIME_PASSWORD_SECRET=(.+)', '\\1') | first | default('', true) }}"
    kibana_encryption_key: "{{ _env_secrets_raw.stdout | regex_search('KIBANA_ENCRYPTION_KEY=(.+)', '\\1') | first | default('', true) }}"
  when: env_file_exists.stat.exists
  no_log: true
  tags: environment

- name: Regenerate Arkime password secret if missing from .env
  ansible.builtin.shell: openssl rand -base64 32
  register: _arkime_secret_regen
  when: (arkime_password_secret | default('') | length) == 0 and env_file_exists.stat.exists
  no_log: true
  tags: environment

- name: Set and persist regenerated Arkime secret
  ansible.builtin.set_fact:
    arkime_password_secret: "{{ _arkime_secret_regen.stdout }}"
  when: _arkime_secret_regen is not skipped
  no_log: true
  tags: environment

- name: Persist regenerated Arkime secret to .env
  ansible.builtin.lineinfile:
    path: "{{ playbook_dir }}/.env"
    regexp: '^ARKIME_PASSWORD_SECRET='
    line: "ARKIME_PASSWORD_SECRET={{ arkime_password_secret }}"
  delegate_to: localhost
  become: false
  when: _arkime_secret_regen is not skipped
  no_log: true
  tags: environment

- name: Create suricata config dict from existing .env
  ansible.builtin.set_fact:
    suricata:
      interface: "{{ suricata_interface }}"
      home_net: "{{ suricata_home_net }}"
  when:
    - env_file_exists.stat.exists
    - use_existing_env.user_input | default('y', true) | lower in ['y', 'yes', '']
  tags: environment

# 2. HANDLE PASSWORDS (VAULT OR PROMPT)

- name: Request Stack Password (If not in Vault)
  ansible.builtin.pause:
    prompt: "Enter password for Elastic/Kibana/TheHive (Required for deployment)"
    echo: no
  register: interactive_password
  when: common_password is not defined or (common_password | string | length == 0)
  tags: environment

- name: Set Password Variable (from prompt when needed)
  ansible.builtin.set_fact:
    common_password: "{{ interactive_password.user_input }}"
  when: common_password is not defined or (common_password | string | length == 0)
  no_log: true
  tags: environment

- name: Verify Password is Set
  ansible.builtin.fail:
    msg: "Password is required! Enter the engagement password when prompted."
  when: common_password is not defined or common_password == ""
  tags: environment

# 3. INTERACTIVE PROMPTS (Skipped if using existing .env)
- name: List available Elastic Stack versions from local registry
  ansible.builtin.shell: |
    python3 - <<'EOF'
    import urllib.request, json, re, sys
    try:
        url = "http://{{ mgmt_box_ip }}:{{ mgmt_registry_port }}/v2/elasticsearch/elasticsearch/tags/list"
        with urllib.request.urlopen(url, timeout=5) as r:
            data = json.loads(r.read())
        tags = data.get('tags', [])
        stable = sorted(
            [t for t in tags if re.match(r'^\d+\.\d+\.\d+$', t)],
            key=lambda v: tuple(int(x) for x in v.split('.'))
        )
        for t in stable:
            print(t)
    except Exception as e:
        sys.stderr.write("Could not query registry: " + str(e) + "\n")
    EOF
  register: _es_available_versions
  changed_when: false
  failed_when: false
  delegate_to: localhost
  become: false
  when: not (skip_env_prompts | default(false))
  tags: environment

- name: Set suggested Elastic Stack version from registry
  ansible.builtin.set_fact:
    _es_suggested: "{{ _es_available_versions.stdout_lines | last }}"
  when:
    - not (skip_env_prompts | default(false))
    - _es_available_versions.stdout_lines | default([]) | length > 0
  tags: environment

- name: Display available Elastic Stack versions
  ansible.builtin.debug:
    msg: "Available in registry: {{ _es_available_versions.stdout_lines }} — suggested: {{ _es_suggested | default(stack_version) }}"
  when:
    - not (skip_env_prompts | default(false))
    - _es_available_versions.stdout_lines | default([]) | length > 0
  tags: environment

- name: Prompt for Elastic Stack version
  ansible.builtin.pause:
    prompt: "Enter Elastic Stack version [{{ _es_suggested | default(stack_version) }}]"
    echo: yes
  register: stack_version_input
  when: not (skip_env_prompts | default(false))
  tags: environment

- name: Prompt for cluster name
  ansible.builtin.pause:
    prompt: "Enter cluster name [orochi]"
    echo: yes
  register: cluster_name_input
  when: not (skip_env_prompts | default(false))
  tags: environment

- name: Prompt for license type
  ansible.builtin.pause:
    prompt: "Enter license type (basic/trial) [basic]"
    echo: yes
  register: license_input
  when: not (skip_env_prompts | default(false))
  tags: environment

- name: Prompt for Elasticsearch memory limit
  ansible.builtin.pause:
    prompt: "Enter Elasticsearch memory limit [4g]"
    echo: yes
  register: mem_limit_input
  when: not (skip_env_prompts | default(false))
  tags: environment

- name: List available Arkime Docker tags from local registry
  ansible.builtin.shell: |
    python3 - <<'EOF'
    import urllib.request, json, sys
    try:
        url = "http://{{ mgmt_box_ip }}:{{ mgmt_registry_port }}/v2/arkime/arkime/tags/list"
        with urllib.request.urlopen(url, timeout=5) as r:
            data = json.loads(r.read())
        for t in data.get('tags', []):
            print(t)
    except Exception as e:
        sys.stderr.write("Could not query registry: " + str(e) + "\n")
    EOF
  register: _arkime_available_tags
  changed_when: false
  failed_when: false
  delegate_to: localhost
  become: false
  when: not (skip_env_prompts | default(false))
  tags: environment

- name: Set suggested Arkime tag from registry
  ansible.builtin.set_fact:
    _arkime_suggested: "{{ _arkime_available_tags.stdout_lines | last }}"
  when:
    - not (skip_env_prompts | default(false))
    - _arkime_available_tags.stdout_lines | default([]) | length > 0
  tags: environment

- name: Display available Arkime Docker tags
  ansible.builtin.debug:
    msg: "Arkime tags in registry: {{ _arkime_available_tags.stdout_lines }} — suggested: {{ _arkime_suggested | default(arkime_version) }}"
  when:
    - not (skip_env_prompts | default(false))
    - _arkime_available_tags.stdout_lines | default([]) | length > 0
  tags: environment

- name: Prompt for Arkime Docker tag
  ansible.builtin.pause:
    prompt: "Enter Arkime Docker tag [{{ _arkime_suggested | default(arkime_version) }}]"
    echo: yes
  register: arkime_version_input
  when: not (skip_env_prompts | default(false))
  tags: environment

- name: Get Velociraptor version from artifact server
  ansible.builtin.uri:
    url: "http://{{ mgmt_box_ip }}:{{ mgmt_artifact_port }}/velociraptor-version.txt"
    return_content: true
    timeout: 5
  register: _velox_version_file
  failed_when: false
  changed_when: false
  delegate_to: localhost
  become: false
  when: not (skip_env_prompts | default(false))
  tags: environment

- name: Get Suricata version from artifact server
  ansible.builtin.uri:
    url: "http://{{ mgmt_box_ip }}:{{ mgmt_artifact_port }}/suricata-version.txt"
    return_content: true
    timeout: 5
  register: _suricata_version_file
  failed_when: false
  changed_when: false
  delegate_to: localhost
  become: false
  when: not (skip_env_prompts | default(false))
  tags: environment

- name: Get Zeek version from artifact server
  ansible.builtin.uri:
    url: "http://{{ mgmt_box_ip }}:{{ mgmt_artifact_port }}/zeek-version.txt"
    return_content: true
    timeout: 5
  register: _zeek_version_file
  failed_when: false
  changed_when: false
  delegate_to: localhost
  become: false
  when: not (skip_env_prompts | default(false))
  tags: environment

- name: Display bare-metal tool versions cached for deployment
  ansible.builtin.debug:
    msg:
      - "Bare-metal tools cached for deployment:"
      - "  Velociraptor: {{ _velox_version_file.content | default('unknown') | trim }}"
      - "  Suricata:     {{ _suricata_version_file.content | default('unknown') | trim }}"
      - "  Zeek:         {{ _zeek_version_file.content | default('unknown') | trim }}"
  when: not (skip_env_prompts | default(false))
  tags: environment

# 4. NETWORK DISCOVERY & SELECTION (Crucial Part)
- name: Build network interfaces list
  ansible.builtin.shell: |
    counter=1
    ip -o -4 addr show | while read line; do
      iface=$(echo "$line" | awk '{print $2}')
      ip=$(echo "$line" | awk '{print $4}' | cut -d'/' -f1)
      case "$iface" in
        lo|docker*|br-*|veth*) continue ;;
      esac
      echo "${counter}. ${iface} (${ip})"
      counter=$((counter + 1))
    done
  register: network_interfaces
  changed_when: false
  when: not (skip_env_prompts | default(false))
  tags: environment

- name: Build IP lookup table
  ansible.builtin.shell: |
    ip -o -4 addr show | while read line; do
      iface=$(echo "$line" | awk '{print $2}')
      ip=$(echo "$line" | awk '{print $4}' | cut -d'/' -f1)
      case "$iface" in
        lo|docker*|br-*|veth*) continue ;;
      esac
      echo "$ip"
    done
  register: ip_lookup_table
  changed_when: false
  when: not (skip_env_prompts | default(false))
  tags: environment

- name: Build interface lookup table
  ansible.builtin.shell: |
    ip -o -4 addr show | while read line; do
      iface=$(echo "$line" | awk '{print $2}')
      case "$iface" in
        lo|docker*|br-*|veth*) continue ;;
      esac
      echo "$iface"
    done
  register: iface_lookup_table
  changed_when: false
  when: not (skip_env_prompts | default(false))
  tags: environment

- name: Display available network interfaces
  ansible.builtin.debug:
    msg: "{{ network_interfaces.stdout_lines }}"
  when: not (skip_env_prompts | default(false))
  tags: environment

- name: Prompt for Suricata interface selection
  ansible.builtin.pause:
    prompt: "Select Suricata interface number or press Enter for default"
    echo: yes
  register: suricata_interface_input
  when: not (skip_env_prompts | default(false))
  tags: environment

- name: Parse Suricata interface selection
  ansible.builtin.set_fact:
    suricata_interface_parsed: "{{ iface_lookup_table.stdout_lines[suricata_interface_input.user_input | int - 1] if suricata_interface_input.user_input | default('') | regex_search('^[0-9]+$') else (iface_lookup_table.stdout_lines[0] | default('eth0')) }}"
  when: not (skip_env_prompts | default(false))
  tags: environment

- name: Prompt for Suricata HOME_NET (CIDR network)
  ansible.builtin.pause:
    prompt: "Enter HOME_NET CIDR for Suricata (e.g., 192.168.0.0/16) [192.168.0.0/16]"
    echo: yes
  register: suricata_home_net_input
  when: not (skip_env_prompts | default(false))
  tags: environment

- name: Parse Suricata HOME_NET
  ansible.builtin.set_fact:
    suricata_home_net_parsed: "{{ suricata_home_net_input.user_input | default('192.168.0.0/16') }}"
  when: not (skip_env_prompts | default(false))
  tags: environment

- name: Create suricata config dict
  ansible.builtin.set_fact:
    suricata:
      interface: "{{ suricata_interface_parsed | default('eth0') }}"
      home_net: "{{ suricata_home_net_parsed | default('192.168.0.0/16') }}"
  when: not (skip_env_prompts | default(false))
  tags: environment

# Fleet, Elasticsearch, Kibana, Velociraptor and Arkime all bind to the
# node itself and are addressed via ansible_host (orochi_server_ip) — no
# separate IP/URL prompts are needed.

- name: Generate Arkime password secret
  ansible.builtin.shell: openssl rand -base64 32
  register: arkime_password_secret_new
  changed_when: false
  when: (arkime_password_secret | default('') | length) == 0
  no_log: true
  tags: environment

- name: Generate Kibana Encryption Key
  ansible.builtin.shell: openssl rand -hex 32
  register: kibana_key_gen
  changed_when: false
  when: (kibana_encryption_key | default('') | length) == 0
  no_log: true
  tags: environment

# If config was reused from an older .env that lacked the key, the prompt-flow
# set_fact below is skipped — set and persist it here instead.
- name: Set regenerated Kibana key when reusing config
  ansible.builtin.set_fact:
    kibana_encryption_key: "{{ kibana_key_gen.stdout }}"
  when:
    - kibana_key_gen is not skipped
    - skip_env_prompts | default(false)
  no_log: true
  tags: environment

- name: Persist regenerated Kibana key to .env when reusing config
  ansible.builtin.lineinfile:
    path: "{{ playbook_dir }}/.env"
    regexp: '^KIBANA_ENCRYPTION_KEY='
    line: "KIBANA_ENCRYPTION_KEY={{ kibana_encryption_key }}"
  delegate_to: localhost
  become: false
  when:
    - kibana_key_gen is not skipped
    - skip_env_prompts | default(false)
  no_log: true
  tags: environment

# 5. VARIABLE MAPPING (Crucial Fix for Passwords)
- name: Propagate Global Passwords to Roles
  ansible.builtin.set_fact:
    elasticsearch_password: "{{ common_password }}"
    kibana_password: "{{ common_password }}"
    thehive_password: "{{ common_password }}"
    velociraptor_password: "{{ common_password }}"
    arkime_password: "{{ common_password }}"
    mattermost_password: "{{ common_password }}"
    fleet_elasticsearch_password: "{{ common_password }}"
  tags: environment

- name: Set variables from prompts
  ansible.builtin.set_fact:

    # =========================
    # CORE STACK VARIABLES
    # =========================
    stack_version: "{{ stack_version_input.user_input | default(_es_suggested | default(stack_version), true) }}"
    arkime_version: "{{ arkime_version_input.user_input | default(_arkime_suggested | default(arkime_version), true) }}"
    cluster_name: "{{ cluster_name_input.user_input | default('orochi', true) }}"
    license: "{{ license_input.user_input | default('basic', true) }}"
    mem_limit: "{{ mem_limit_input.user_input | default('4g', true) }}"

    # =========================
    # USERS / ROLES
    # =========================
    velox_user: "admin"

    # =========================
    # NETWORK
    # =========================
    suricata_interface: "{{ suricata_interface_parsed }}"

    # =========================
    # SECRETS (REUSED FROM .ENV OR RUNTIME GENERATED)
    # =========================
    arkime_password_secret: "{{ arkime_password_secret | default(arkime_password_secret_new.stdout, true) }}"
    kibana_encryption_key: "{{ kibana_encryption_key | default(kibana_key_gen.stdout, true) }}"

    # =========================
    # RESOURCE LIMITS (REQUIRED)
    # =========================
    resources:
      elasticsearch:
        memory: "{{ mem_limit_input.user_input | default('4g', true) }}"
        heap: "2g"
      kibana:
        memory: "2g"
      thehive:
        memory: "2g"
      cassandra:
        memory: "2g"
        heap: "1024M"
        heap_new: "256M"
      elasticsearch_hive:
        memory: "1g"
        heap: "512m"
      suricata:
        memory: "2g"
      mattermost:
        memory: "1g"
      timesketch:
        memory: "2g"
      redis:
        memory: "256m"

  when: not (skip_env_prompts | default(false))
  no_log: true
  tags: environment



# 6. WRITE .ENV (No Passwords) - On control node only
- name: Create/Update .env file on control node
  ansible.builtin.copy:
    content: |
      # ==============================================
      # Orochi Security Stack Configuration
      # Generated: {{ ansible_date_time.iso8601 }}
      # Target: {{ inventory_hostname }}
      # ==============================================
      STACK_VERSION={{ stack_version }}
      CLUSTER_NAME={{ cluster_name }}
      LICENSE={{ license }}
      MEM_LIMIT={{ mem_limit }}
      VELOX_USER={{ velox_user }}
      SURICATA_INTERFACE={{ suricata_interface }}
      SURICATA_HOME_NET={{ suricata.home_net }}
      ARKIME_PASSWORD_SECRET={{ arkime_password_secret }}
      KIBANA_ENCRYPTION_KEY={{ kibana_encryption_key }}
      MGMT_BOX_IP={{ mgmt_box_ip }}
      OROCHI_NODE_IP={{ ansible_host }}
      ARKIME_VERSION={{ arkime_version }}
      DEFAULT_TIMEOUT=300
    dest: "{{ playbook_dir }}/.env"
    mode: '0600'
  delegate_to: localhost
  become: false
  when: not (skip_env_prompts | default(false))
  tags: environment

- name: Set capture interface to promiscuous mode
  ansible.builtin.shell: ip link set {{ suricata.interface }} promisc on
  changed_when: false
  tags: environment

- name: Create systemd unit for promiscuous mode persistence
  ansible.builtin.copy:
    dest: /etc/systemd/system/promisc-{{ suricata.interface }}.service
    mode: '0644'
    content: |
      [Unit]
      Description=Set {{ suricata.interface }} to promiscuous mode for packet capture
      After=network.target

      [Service]
      Type=oneshot
      ExecStart=/usr/sbin/ip link set {{ suricata.interface }} promisc on
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
  tags: environment

- name: Enable promiscuous mode persistence
  ansible.builtin.systemd:
    name: promisc-{{ suricata.interface }}
    enabled: true
    state: started
    daemon_reload: true
  tags: environment