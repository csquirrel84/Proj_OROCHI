---
- name: Gather facts if not already gathered
  ansible.builtin.setup:
  when: ansible_distribution is not defined
  tags: suricata

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags: suricata

# ── Pre-create all Suricata directories and config files ──────────────────────
# Done before package install so dpkg can never fail on missing paths.
# Uses facts already set by the environment role (suricata.interface etc).

- name: Create Suricata directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/suricata
    - /var/log/suricata
    - /var/lib/suricata/rules
  tags: suricata

- name: Configure Suricata YAML
  ansible.builtin.copy:
    dest: /etc/suricata/suricata.yaml
    mode: '0644'
    backup: yes
    content: |
      %YAML 1.1
      ---
      vars:
        address-groups:
          HOME_NET: "{{ suricata.home_net }}"
          EXTERNAL_NET: "!$HOME_NET"
          HTTP_SERVERS: "$HOME_NET"
          SMTP_SERVERS: "$HOME_NET"
          SQL_SERVERS: "$HOME_NET"
          DNS_SERVERS: "$HOME_NET"
          TELNET_SERVERS: "$HOME_NET"
          AIM_SERVERS: "$EXTERNAL_NET"
          DC_SERVERS: "$HOME_NET"
        port-groups:
          HTTP_PORTS: "80"
          SHELLCODE_PORTS: "!80"
          ORACLE_PORTS: "1521"
          SSH_PORTS: "22"
          DNP3_PORTS: "20000"
          MODBUS_PORTS: "502"
          FILE_DATA_PORTS: "[$HTTP_PORTS,110,143]"
          FTP_PORTS: 21

      default-log-dir: /var/log/suricata/

      outputs:
        - eve-log:
            enabled: yes
            filetype: regular
            filename: eve.json
            types:
              - alert:
                  tagged-packets: yes
              - anomaly:
                  enabled: yes
              - http:
                  extended: yes
              - dns:
                  query: yes
                  answer: yes
              - tls:
                  extended: yes
              - files:
                  force-magic: no
              - smtp:
              - ssh
              - flow
              - netflow
        - fast:
            enabled: yes
            filename: fast.log
            append: yes
        - stats:
            enabled: yes
            filename: stats.log
            append: yes

      logging:
        default-log-level: notice
        outputs:
          - console:
              enabled: yes
          - file:
              enabled: yes
              level: info
              filename: suricata.log

      af-packet:
        - interface: {{ suricata.interface }}
          threads: auto
          cluster-id: 99
          cluster-type: cluster_flow
          defrag: yes
          use-mmap: yes
          mmap-locked: yes
          tpacket-v3: yes
          ring-size: 2048
          block-size: 32768

      app-layer:
        protocols:
          tls:
            enabled: yes
            detection-ports:
              dp: 443
          http:
            enabled: yes
          dns:
            tcp:
              enabled: yes
              detection-ports:
                dp: 53
            udp:
              enabled: yes
              detection-ports:
                dp: 53
          ssh:
            enabled: yes
          smtp:
            enabled: yes
          ftp:
            enabled: yes
          smb:
            enabled: yes

      threading:
        set-cpu-affinity: no
        detect-thread-ratio: 1.0

      default-rule-path: /var/lib/suricata/rules
      rule-files:
        - suricata.rules

      detect:
        profile: low
        sgh-mpm-context: auto
        inspection-recursion-limit: 3000

      stream:
        memcap: 64mb
        checksum-validation: yes
        inline: auto
        reassembly:
          memcap: 256mb
          depth: 1mb

      flow:
        memcap: 128mb
        hash-size: 65536
        prealloc: 10000
        emergency-recovery: 30

      capture:
        disable-offloading: true

      stats:
        enabled: yes
        interval: 8
  tags: suricata

- name: Configure Suricata interface in /etc/default/suricata
  ansible.builtin.copy:
    dest: /etc/default/suricata
    content: |
      IFACE={{ suricata.interface }}
    mode: '0644'
  tags: suricata

# ── Install ────────────────────────────────────────────────────────────────────

- name: Create temp directory for Suricata debs
  ansible.builtin.file:
    path: /tmp/suricata-debs
    state: directory
    mode: '0755'
  tags: suricata

- name: Download Suricata debs tarball from artifact server
  ansible.builtin.get_url:
    url: "{{ artifact_base_url }}/suricata-debs.tar.gz"
    dest: /tmp/suricata-debs.tar.gz
    mode: '0644'
  tags: suricata

- name: Extract Suricata debs
  ansible.builtin.unarchive:
    src: /tmp/suricata-debs.tar.gz
    dest: /tmp
    remote_src: true
  tags: suricata

- name: Install Suricata from pre-cached packages
  ansible.builtin.shell: |
    set -e
    trap 'rm -f /usr/sbin/policy-rc.d' EXIT
    echo 'exit 101' > /usr/sbin/policy-rc.d
    chmod +x /usr/sbin/policy-rc.d
    DEBIAN_FRONTEND=noninteractive dpkg -i --force-confold /tmp/suricata-debs/*.deb
  register: suricata_install
  changed_when: "'Setting up' in suricata_install.stdout"
  tags: suricata

# ── Rules — use pre-downloaded tarball ────────────────────────────────────────

- name: Download pre-cached Suricata rules from artifact server
  ansible.builtin.get_url:
    url: "{{ artifact_base_url }}/suricata-rules.tar.gz"
    dest: /tmp/suricata-rules.tar.gz
    mode: '0644'
  tags: suricata

- name: Extract Suricata rules
  ansible.builtin.unarchive:
    src: /tmp/suricata-rules.tar.gz
    dest: /var/lib/suricata
    remote_src: true
  tags: suricata

# ── Service ────────────────────────────────────────────────────────────────────

- name: Ensure override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/suricata.service.d
    state: directory
    mode: '0755'
  tags: suricata

- name: Create Suricata systemd service override
  ansible.builtin.copy:
    dest: /etc/systemd/system/suricata.service.d/override.conf
    content: |
      [Service]
      Type=simple
      ExecStart=
      ExecStart=/usr/bin/suricata -c /etc/suricata/suricata.yaml --af-packet={{ suricata.interface }}
      TimeoutStartSec=120
      Restart=on-failure
      RestartSec=10s
    mode: '0644'
  notify: reload systemd
  tags: suricata

- name: Enable Suricata service
  ansible.builtin.systemd:
    name: suricata
    enabled: true
    daemon_reload: true
  tags: suricata

- name: Start Suricata in background
  ansible.builtin.command: systemctl restart --no-block suricata
  changed_when: true
  tags: suricata

- name: Display Suricata status
  ansible.builtin.debug:
    msg:
      - "Suricata starting on {{ suricata.interface }} (rule compilation runs in background)"
      - "Check status: systemctl status suricata"
      - "Logs: /var/log/suricata/eve.json"
      - "Rules: /var/lib/suricata/rules"
  tags: suricata
