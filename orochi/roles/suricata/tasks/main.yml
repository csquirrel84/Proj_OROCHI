---
- name: Gather facts if not already gathered
  ansible.builtin.setup:
  when: ansible_distribution is not defined
  tags: suricata

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags: suricata

# ── Pre-create all Suricata directories and config files ──────────────────────
# Done before package install so dpkg can never fail on missing paths.
# Uses facts already set by the environment role (suricata.interface etc).

- name: Create Suricata directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/suricata
    - /var/log/suricata
    - /var/lib/suricata/rules
  tags: suricata

- name: Configure Suricata YAML
  ansible.builtin.template:
    src: suricata.yaml.j2
    dest: /etc/suricata/suricata.yaml
    mode: '0644'
    backup: yes
  tags: suricata

- name: Configure Suricata interface in /etc/default/suricata
  ansible.builtin.copy:
    dest: /etc/default/suricata
    content: |
      IFACE={{ suricata.interface }}
    mode: '0644'
  tags: suricata

# ── Install ────────────────────────────────────────────────────────────────────

- name: Create temp directory for Suricata debs
  ansible.builtin.file:
    path: /tmp/suricata-debs
    state: directory
    mode: '0755'
  tags: suricata

- name: Download Suricata debs tarball from artifact server
  ansible.builtin.get_url:
    url: "{{ artifact_base_url }}/suricata-debs.tar.gz"
    dest: /tmp/suricata-debs.tar.gz
    mode: '0644'
  tags: suricata

- name: Extract Suricata debs
  ansible.builtin.unarchive:
    src: /tmp/suricata-debs.tar.gz
    dest: /tmp
    remote_src: true
  tags: suricata

- name: Install Suricata from pre-cached packages
  ansible.builtin.shell: |
    set -e
    trap 'rm -f /usr/sbin/policy-rc.d' EXIT
    echo 'exit 101' > /usr/sbin/policy-rc.d
    chmod +x /usr/sbin/policy-rc.d
    DEBIAN_FRONTEND=noninteractive dpkg -i --force-confold /tmp/suricata-debs/*.deb
  register: suricata_install
  changed_when: "'Setting up' in suricata_install.stdout"
  tags: suricata

# ── Rules — use pre-downloaded tarball ────────────────────────────────────────

- name: Download pre-cached Suricata rules from artifact server
  ansible.builtin.get_url:
    url: "{{ artifact_base_url }}/suricata-rules.tar.gz"
    dest: /tmp/suricata-rules.tar.gz
    mode: '0644'
  tags: suricata

- name: Extract Suricata rules
  ansible.builtin.unarchive:
    src: /tmp/suricata-rules.tar.gz
    dest: /var/lib/suricata
    remote_src: true
  tags: suricata

# ── Service ────────────────────────────────────────────────────────────────────

- name: Ensure override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/suricata.service.d
    state: directory
    mode: '0755'
  tags: suricata

- name: Create Suricata systemd service override
  ansible.builtin.copy:
    dest: /etc/systemd/system/suricata.service.d/override.conf
    content: |
      [Service]
      Type=simple
      ExecStart=
      ExecStart=/usr/bin/suricata -c /etc/suricata/suricata.yaml --af-packet={{ suricata.interface }}
      TimeoutStartSec=120
      Restart=on-failure
      RestartSec=10s
    mode: '0644'
  notify: reload systemd
  tags: suricata

- name: Enable Suricata service
  ansible.builtin.systemd:
    name: suricata
    enabled: true
    daemon_reload: true
  tags: suricata

- name: Start Suricata in background
  ansible.builtin.command: systemctl restart --no-block suricata
  changed_when: true
  tags: suricata

- name: Display Suricata status
  ansible.builtin.debug:
    msg:
      - "Suricata starting on {{ suricata.interface }} (rule compilation runs in background)"
      - "Check status: systemctl status suricata"
      - "Logs: /var/log/suricata/eve.json"
      - "Rules: /var/lib/suricata/rules"
  tags: suricata

# ── Suricata Manager (per-source rule toggle + update API) ────────────────────
# Serves a small control API on the analyst NIC so an analyst can enable/
# disable cached rule sources and pull refreshed bundles from the management
# box — all offline. stdlib-only Python, runs as a systemd service.

- name: Create Suricata sources directory
  ansible.builtin.file:
    path: /var/lib/suricata/sources
    state: directory
    mode: '0755'
  tags: suricata

- name: Download per-source Suricata bundle from artifact server
  ansible.builtin.get_url:
    url: "{{ artifact_base_url }}/suricata-sources.tar.gz"
    dest: /tmp/suricata-sources.tar.gz
    mode: '0644'
  register: _suri_sources_dl
  failed_when: false
  tags: suricata

- name: Extract per-source Suricata bundle
  ansible.builtin.unarchive:
    src: /tmp/suricata-sources.tar.gz
    dest: /var/lib/suricata
    remote_src: true
  when: _suri_sources_dl is succeeded and _suri_sources_dl.status_code | default(0) == 200
  tags: suricata

- name: Warn if per-source bundle is unavailable
  ansible.builtin.debug:
    msg: >-
      suricata-sources.tar.gz not found on the artifact server — the Suricata
      Manager will show no sources until prep_artefacts.yml is re-run with the
      updated playbook. The merged ruleset is still deployed and active.
  when: not (_suri_sources_dl is succeeded and _suri_sources_dl.status_code | default(0) == 200)
  tags: suricata

- name: Resolve analyst-facing IP for the manager to bind
  ansible.builtin.shell: |
    ip -o route get {{ mgmt_box_ip }} | grep -oP 'src \K\S+'
  register: _suri_mgr_ip
  changed_when: false
  tags: suricata

- name: Install Suricata Manager script
  ansible.builtin.copy:
    src: suricata_manager.py
    dest: /usr/local/bin/orochi-suricata-manager
    mode: '0755'
  tags: suricata

- name: Install Suricata Manager systemd unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/orochi-suricata-manager.service
    mode: '0644'
    content: |
      [Unit]
      Description=OROCHI Suricata Manager (rule source control API)
      After=suricata.service network-online.target
      Wants=network-online.target

      [Service]
      Type=simple
      Environment=OROCHI_ARTIFACT_URL={{ artifact_base_url }}
      Environment=OROCHI_BIND_HOST={{ _suri_mgr_ip.stdout | trim | default('0.0.0.0', true) }}
      Environment=OROCHI_BIND_PORT={{ suricata_manager_port | default('7000') }}
      ExecStart=/usr/bin/python3 /usr/local/bin/orochi-suricata-manager
      Restart=on-failure
      RestartSec=5s

      [Install]
      WantedBy=multi-user.target
  tags: suricata

- name: Enable and start Suricata Manager
  ansible.builtin.systemd:
    name: orochi-suricata-manager
    enabled: true
    state: restarted
    daemon_reload: true
  tags: suricata

- name: Display Suricata Manager info
  ansible.builtin.debug:
    msg:
      - "Suricata Manager: http://{{ _suri_mgr_ip.stdout | trim }}:{{ suricata_manager_port | default('7000') }}/"
      - "Toggle rule sources and pull updates from the portal (Suricata card)."
  tags: suricata
