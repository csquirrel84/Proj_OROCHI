---
- name: Gather facts if not already gathered
  ansible.builtin.setup:
  when: ansible_facts['distribution'] is not defined
  tags: suricata

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags: suricata

# ── Pre-create all Suricata directories and config files ──────────────────────
# Done before package install so dpkg can never fail on missing paths.
# Uses facts already set by the environment role (suricata.interface etc).

- name: Create Suricata directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/suricata
    - /var/log/suricata
    - /var/lib/suricata/rules
  tags: suricata

- name: Configure Suricata YAML
  ansible.builtin.template:
    src: suricata.yaml.j2
    dest: /etc/suricata/suricata.yaml
    mode: '0644'
    backup: yes
  tags: suricata

- name: Configure Suricata interface in /etc/default/suricata
  ansible.builtin.copy:
    dest: /etc/default/suricata
    content: |
      IFACE={{ suricata.interface }}
    mode: '0644'
  tags: suricata

# ── Install ────────────────────────────────────────────────────────────────────

- name: Create temp directory for Suricata debs
  ansible.builtin.file:
    path: /tmp/suricata-debs
    state: directory
    mode: '0755'
  tags: suricata

- name: Download Suricata debs tarball from artifact server
  ansible.builtin.get_url:
    url: "{{ artifact_base_url }}/suricata-debs.tar.gz"
    dest: /tmp/suricata-debs.tar.gz
    mode: '0644'
  tags: suricata

- name: Extract Suricata debs
  ansible.builtin.unarchive:
    src: /tmp/suricata-debs.tar.gz
    dest: /tmp
    remote_src: true
  tags: suricata

- name: Install Suricata from pre-cached packages
  ansible.builtin.shell: |
    set -e
    trap 'rm -f /usr/sbin/policy-rc.d' EXIT
    echo 'exit 101' > /usr/sbin/policy-rc.d
    chmod +x /usr/sbin/policy-rc.d
    DEBIAN_FRONTEND=noninteractive dpkg -i --force-confold /tmp/suricata-debs/*.deb
  register: suricata_install
  changed_when: "'Setting up' in suricata_install.stdout"
  tags: suricata

# ── Rules — build via suricata-update, pointed at the management box ──────────
# The management box mirrors every free Suricata rule source (no auth
# parameters — ET Open, abuse.ch SSLbl/URLhaus, OISF traffic-id, etc.) as
# plain per-source .rules files under {{ artifact_base_url }}/suricata-sources/
# (see playbooks/prep_artefacts.yml and files/fetch_suricata_sources.py).
# Each source is registered here with that explicit URL, so suricata-update
# fetches straight from the management box and never needs the real
# internet-facing source index.
#
# Registration is persisted to /var/lib/suricata/sources/*.yaml, so once
# deployed an analyst can update rules later just by running `suricata-update`
# directly on the node (no Ansible needed) — an engineer refreshes the
# sources on the management box (prep_artefacts.yml or check_updates.yml
# -e refresh_suricata=true), then the analyst re-runs suricata-update here.

- name: Configure suricata-update to live-reload after a manual run
  ansible.builtin.copy:
    dest: /etc/suricata/update.yaml
    content: |
      reload-command: suricatasc -c reload-rules
    mode: '0644'
  tags: suricata

- name: Fetch Suricata source manifest from artifact server
  ansible.builtin.uri:
    url: "{{ artifact_base_url }}/suricata-sources/manifest.json"
    return_content: true
  register: _suri_manifest_raw
  tags: suricata

- name: Parse Suricata source manifest
  ansible.builtin.set_fact:
    _suri_sources: "{{ (_suri_manifest_raw.content | from_json).sources }}"
  tags: suricata

# Two suricata-update quirks worked around here:
#
# 1. Its enable-source lookup is broken for any name containing a "/" (e.g.
#    "ipfire/dbl"): it falls back to re-deriving names from filenames on
#    disk via a hyphen replace that it never un-does, so "ipfire/dbl" (file
#    ipfire-dbl.yaml) can never match itself. Sidestepped by using the
#    slash-free "safe" name (manifest file name minus ".rules") as the
#    actual suricata-update source identifier — safe_filename() is a no-op
#    on a string with no slashes, so lookups always succeed.
#
# 2. add-source already registers a source in the *enabled* state with our
#    explicit URL intact — there is no separate enable step needed. Calling
#    enable-source afterwards actively breaks it: enable-source rewrites
#    the on-disk config from scratch without carrying the "url" field over,
#    so the source silently loses its URL and suricata-update falls back to
#    looking it up in the real/bundled index (where it doesn't exist) and
#    skips it entirely — "Source no longer exists in index and will not be
#    fetched". So: remove + add only, no enable-source call.

- name: Remove any previously registered Suricata sources (clean re-add)
  ansible.builtin.command:
    argv:
      - suricata-update
      - remove-source
      - "{{ item.value.file | regex_replace('\\.rules$', '') }}"
  loop: "{{ _suri_sources | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  failed_when: false
  changed_when: true
  tags: suricata

- name: Register free Suricata sources, pointed at the management box
  ansible.builtin.command:
    argv:
      - suricata-update
      - add-source
      - "{{ item.value.file | regex_replace('\\.rules$', '') }}"
      - "{{ artifact_base_url }}/suricata-sources/{{ item.value.file }}"
      - --no-checksum
  loop: "{{ _suri_sources | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  changed_when: true
  tags: suricata

- name: Build merged ruleset with suricata-update
  # --force bypasses suricata-update's 15-minute / checksum-match fetch
  # skip, so a re-run always pulls whatever is currently on the management
  # box instead of silently reusing a locally cached copy.
  ansible.builtin.command: suricata-update --force
  changed_when: true
  tags: suricata

# ── Service ────────────────────────────────────────────────────────────────────

- name: Ensure override directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/suricata.service.d
    state: directory
    mode: '0755'
  tags: suricata

- name: Create Suricata systemd service override
  ansible.builtin.copy:
    dest: /etc/systemd/system/suricata.service.d/override.conf
    content: |
      [Service]
      Type=simple
      ExecStart=
      ExecStart=/usr/bin/suricata -c /etc/suricata/suricata.yaml --af-packet={{ suricata.interface }}
      TimeoutStartSec=120
      Restart=on-failure
      RestartSec=10s
    mode: '0644'
  notify: reload systemd
  tags: suricata

- name: Enable Suricata service
  ansible.builtin.systemd:
    name: suricata
    enabled: true
    daemon_reload: true
  tags: suricata

- name: Start Suricata in background
  ansible.builtin.command: systemctl restart --no-block suricata
  changed_when: true
  tags: suricata

- name: Display Suricata status
  ansible.builtin.debug:
    msg:
      - "Suricata starting on {{ suricata.interface }} (rule compilation runs in background)"
      - "Check status: systemctl status suricata"
      - "Logs: /var/log/suricata/eve.json"
      - "Rules: /var/lib/suricata/rules"
      - "To pull updated rules later: refresh sources on the management box"
      - "(prep_artefacts.yml or check_updates.yml -e refresh_suricata=true),"
      - "then on this node just run: suricata-update"
  tags: suricata
