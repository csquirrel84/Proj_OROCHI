---
- name: Install WireGuard
  ansible.builtin.apt:
    name: wireguard
    state: present
    update_cache: true

- name: Check if server private key already exists
  ansible.builtin.stat:
    path: /etc/wireguard/server.key
  register: wg_key_stat

- name: Generate server private key (first run only)
  ansible.builtin.shell: wg genkey > /etc/wireguard/server.key && chmod 600 /etc/wireguard/server.key
  when: not wg_key_stat.stat.exists

- name: Read server private key
  ansible.builtin.slurp:
    src: /etc/wireguard/server.key
  register: wg_key_slurp
  no_log: true

- name: Set server private key fact
  ansible.builtin.set_fact:
    wireguard_server_privkey: "{{ wg_key_slurp.content | b64decode | trim }}"
  no_log: true

- name: Derive server public key
  ansible.builtin.shell: cat /etc/wireguard/server.key | wg pubkey
  register: wg_pubkey
  changed_when: false

- name: Display server public key
  ansible.builtin.debug:
    msg: "WireGuard server public key: {{ wg_pubkey.stdout }}"

- name: Deploy WireGuard config
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: /etc/wireguard/{{ wireguard_interface }}.conf
    owner: root
    group: root
    mode: '0600'
  notify: restart wireguard

- name: Enable and start WireGuard
  ansible.builtin.systemd:
    name: wg-quick@{{ wireguard_interface }}
    enabled: true
    state: started
