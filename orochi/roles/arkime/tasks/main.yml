---
# ==============================================
# ARKIME ROLE - Full Packet Capture (Docker)
# Two containers from the same image:
#   arkimecapture  — packet capture, network_mode: host + NET_ADMIN/NET_RAW
#   arkimeviewer   — web UI on port {{ ports.arkime }}, network_mode: host
# db.pl init/ILM run as one-shot docker run --rm with --insecure because
# db.pl is a Perl script and does not read ARKIME__ environment variables.
# ==============================================

- name: Create Arkime PCAP directory
  ansible.builtin.file:
    path: "{{ directories.arkime }}/raw"
    state: directory
    mode: '0755'
    owner: nobody
    group: daemon
  tags: arkime

- name: Wait for Elasticsearch to be ready
  ansible.builtin.uri:
    url: "https://localhost:{{ ports.elasticsearch }}/_cluster/health"
    method: GET
    user: elastic
    password: "{{ elasticsearch_password }}"
    validate_certs: false
    status_code: 200
  register: es_health
  until: es_health.status == 200
  retries: 30
  delay: 10
  tags: arkime

- name: Check if Arkime indices are initialised
  ansible.builtin.uri:
    url: "https://localhost:{{ ports.elasticsearch }}/arkime_users"
    method: HEAD
    user: elastic
    password: "{{ elasticsearch_password }}"
    validate_certs: false
    status_code: [200, 404]
  register: arkime_users_check

  tags: arkime

- name: Initialise Arkime Elasticsearch indices
  ansible.builtin.shell: |
    docker run --rm --network host \
      -v {{ directories.certs }}/ca/ca.crt:/opt/arkime/etc/ca.crt:ro \
      -e "ARKIME__elasticsearch=https://localhost:{{ ports.elasticsearch }}" \
      -e "ARKIME__elasticsearchBasicAuth=elastic:{{ elasticsearch_password }}" \
      {{ images.arkime }} \
      /opt/arkime/db/db.pl --insecure \
      "https://localhost:{{ ports.elasticsearch }}" init --ilm
  register: arkime_db_init
  failed_when:
    - arkime_db_init.rc != 0
    - "'already' not in (arkime_db_init.stdout | default('') + arkime_db_init.stderr | default(''))"
  when: arkime_users_check.status == 404

  tags: arkime

- name: Configure ILM policy (1-day rotation, 30-day retention)
  ansible.builtin.shell: |
    docker run --rm --network host \
      -v {{ directories.certs }}/ca/ca.crt:/opt/arkime/etc/ca.crt:ro \
      -e "ARKIME__elasticsearch=https://localhost:{{ ports.elasticsearch }}" \
      -e "ARKIME__elasticsearchBasicAuth=elastic:{{ elasticsearch_password }}" \
      {{ images.arkime }} \
      /opt/arkime/db/db.pl --insecure \
      "https://localhost:{{ ports.elasticsearch }}" ilm 1d 30d
  register: arkime_ilm
  failed_when:
    - arkime_ilm.rc != 0
    - "'already' not in (arkime_ilm.stdout | default('') + arkime_ilm.stderr | default(''))"
  when: arkime_users_check.status == 404

  tags: arkime

- name: Write minimal Arkime config.ini for user creation
  ansible.builtin.copy:
    dest: "{{ directories.arkime }}/config.ini"
    mode: '0644'
    content: |
      [default]
      elasticsearch=https://localhost:{{ ports.elasticsearch }}
      passwordSecret={{ arkime_password_secret }}
  tags: arkime

- name: Create Arkime admin user
  # Runs unconditionally — arkime_add_user.sh exits 0 if user already exists.
  # arkime_add_user.sh requires config.ini and does not read ARKIME__ env vars.
  ansible.builtin.shell: |
    docker run --rm --network host \
      -v {{ directories.certs }}/ca/ca.crt:/opt/arkime/etc/ca.crt:ro \
      -v {{ directories.arkime }}/config.ini:/opt/arkime/etc/config.ini:ro \
      -e "ARKIME__elasticsearch=https://localhost:{{ ports.elasticsearch }}" \
      -e "ARKIME__elasticsearchBasicAuth=elastic:{{ elasticsearch_password }}" \
      -e "ARKIME__caTrustFile=/opt/arkime/etc/ca.crt" \
      -e "ARKIME__passwordSecret={{ arkime_password_secret }}" \
      {{ images.arkime }} \
      /opt/arkime/bin/arkime_add_user.sh \
      admin "Admin User" "{{ arkime_password }}" --admin
  register: arkime_user_create
  failed_when:
    - arkime_user_create.rc != 0
    - "'already' not in (arkime_user_create.stdout | default('') + arkime_user_create.stderr | default(''))"
  # no_log: command line contains the engagement password (would land in install.log)
  no_log: true
  tags: arkime


# Note: no unconditional container removal here — docker_container is
# idempotent and recreates only when configuration or image changed. This
# keeps re-runs from dropping packet capture unnecessarily.
- name: Start Arkime capture container
  community.docker.docker_container:
    name: arkimecapture
    image: "{{ images.arkime }}"
    state: started
    restart_policy: unless-stopped
    network_mode: host
    capabilities:
      - NET_ADMIN
      - NET_RAW
    ulimits:
      - "memlock:-1:-1"
    env:
      ARKIME__elasticsearch: "https://localhost:{{ ports.elasticsearch }}"
      ARKIME__elasticsearchBasicAuth: "elastic:{{ elasticsearch_password }}"
      ARKIME__caTrustFile: "/opt/arkime/etc/ca.crt"
      ARKIME__passwordSecret: "{{ arkime_password_secret }}"
      ARKIME__interface: "{{ suricata.interface }}"
      ARKIME__pcapDir: "/opt/arkime/raw"
      ARKIME__viewPort: "{{ ports.arkime_capture | string }}"
      ARKIME__maxFileSizeG: "12"
      ARKIME__freeSpaceG: "5%"
      ARKIME__rotateIndex: "daily"
      ARKIME__compressES: "true"
      ARKIME__dbBulkSize: "1000000"
      ARKIME__packetThreads: "2"
      ARKIME__dropUser: "nobody"
      ARKIME__dropGroup: "daemon"
      ARKIME__spiDataMaxIndices: "5"
      ARKIME__maxESConns: "30"
      ARKIME__maxESRequests: "500"
      ARKIME__dbFlushTimeout: "5"
    volumes:
      - "{{ directories.arkime }}/raw:/opt/arkime/raw"
      - "{{ directories.certs }}/ca/ca.crt:/opt/arkime/etc/ca.crt:ro"
    command: /opt/arkime/bin/docker.sh capture

  notify: restart arkime
  tags: arkime


- name: Start Arkime viewer container
  community.docker.docker_container:
    name: arkimeviewer
    image: "{{ images.arkime }}"
    state: started
    restart_policy: unless-stopped
    network_mode: host
    env:
      ARKIME__elasticsearch: "https://localhost:{{ ports.elasticsearch }}"
      ARKIME__elasticsearchBasicAuth: "elastic:{{ elasticsearch_password }}"
      ARKIME__caTrustFile: "/opt/arkime/etc/ca.crt"
      ARKIME__passwordSecret: "{{ arkime_password_secret }}"
      ARKIME__pcapDir: "/opt/arkime/raw"
      ARKIME__viewPort: "{{ ports.arkime | string }}"
      ARKIME__viewHost: "0.0.0.0"
      ARKIME__authMode: "digest"
      ARKIME__cronQueries: "true"
    volumes:
      - "{{ directories.arkime }}/raw:/opt/arkime/raw"
      - "{{ directories.certs }}/ca/ca.crt:/opt/arkime/etc/ca.crt:ro"
    command: /opt/arkime/bin/docker.sh viewer

  notify: restart arkime
  tags: arkime

- name: Wait for Arkime viewer to be ready
  ansible.builtin.wait_for:
    host: localhost
    port: "{{ ports.arkime }}"
    delay: 5
    timeout: 60
    state: started
  register: arkime_viewer_wait
  ignore_errors: true
  tags: arkime

- name: Show viewer logs if not ready
  ansible.builtin.command: docker logs --tail 50 arkimeviewer
  register: arkime_viewer_logs
  changed_when: false
  when: arkime_viewer_wait is failed
  tags: arkime

- name: Display viewer logs
  ansible.builtin.debug:
    msg: "{{ arkime_viewer_logs.stdout_lines | default([]) }}"
  when: arkime_viewer_wait is failed
  tags: arkime

- name: Fail if viewer did not start
  ansible.builtin.fail:
    msg: "Arkime viewer failed to start on port {{ ports.arkime }}. Check logs above."
  when: arkime_viewer_wait is failed
  tags: arkime

- name: Display Arkime status
  ansible.builtin.debug:
    msg:
      - "Arkime ({{ arkime_version }}) running in Docker"
      - ""
      - "Viewer:    http://{{ orochi_server_ip }}:{{ ports.arkime }}"
      - "Username:  admin"
      - "Interface: {{ suricata.interface }}"
      - "PCAP dir:  {{ directories.arkime }}/raw"
      - "ES health: {{ es_health.json.status }}"
      - ""
      - "docker logs -f arkimecapture"
      - "docker logs -f arkimeviewer"
  tags: arkime
