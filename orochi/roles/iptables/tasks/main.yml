---
- name: Discover analyst NIC name from MAC address
  ansible.builtin.shell: "ip link | grep -B1 '{{ analyst_nic_mac }}' | head -1 | awk -F': ' '{print $2}'"
  register: _analyst_nic
  changed_when: false
  failed_when: _analyst_nic.stdout | length == 0

- name: Discover target NIC name from MAC address
  ansible.builtin.shell: "ip link | grep -B1 '{{ target_nic_mac }}' | head -1 | awk -F': ' '{print $2}'"
  register: _target_nic
  changed_when: false
  failed_when: _target_nic.stdout | length == 0

- name: Set interface name facts
  ansible.builtin.set_fact:
    nic_analyst: "{{ _analyst_nic.stdout | trim }}"
    nic_target: "{{ _target_nic.stdout | trim }}"

- name: Show discovered interface names
  ansible.builtin.debug:
    msg:
      - "Analyst LAN:    {{ nic_analyst }}"
      - "Target network: {{ nic_target }}"
      - "WireGuard BOO:  {{ nic_wg_bearer }}"

- name: Install iptables-persistent
  ansible.builtin.apt:
    name:
      - iptables
      - iptables-persistent
      - netfilter-persistent
    state: present
    update_cache: true

- name: Deploy iptables rules
  ansible.builtin.template:
    src: rules.v4.j2
    dest: /etc/iptables/rules.v4
    owner: root
    group: root
    mode: '0640'
  notify: reload iptables

- name: Apply iptables rules now
  ansible.builtin.command: iptables-restore /etc/iptables/rules.v4
  changed_when: true

- name: Enable netfilter-persistent to restore rules on boot
  ansible.builtin.systemd:
    name: netfilter-persistent
    enabled: true
    state: started

# nic2 promiscuous mode — only when capture NIC is physically installed
- name: Create systemd unit for nic2 promiscuous mode
  ansible.builtin.copy:
    dest: /etc/systemd/system/promisc-{{ nic_capture }}.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Set {{ nic_capture }} promiscuous mode
      After=network.target

      [Service]
      Type=oneshot
      ExecStart=/sbin/ip link set {{ nic_capture }} promisc on
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
  when: capture_nic_present | bool
  notify: reload systemd

- name: Enable promiscuous mode service for nic2
  ansible.builtin.systemd:
    name: promisc-{{ nic_capture }}.service
    enabled: true
    state: started
    daemon_reload: true
  when: capture_nic_present | bool
