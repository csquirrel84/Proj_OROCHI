---
# ==============================================
# RITA ROLE - Network Traffic Analysis (Docker-based)
# RITA v5 uses docker-compose with ClickHouse backend.
# All images served from local registry; fully offline.
# No standalone binary — analysis runs inside containers.
# ==============================================

- name: Create RITA directory
  ansible.builtin.file:
    path: /opt/rita
    state: directory
    mode: '0755'
  tags: rita

- name: Create RITA log directory
  ansible.builtin.file:
    path: /var/log/rita
    state: directory
    mode: '0755'
  tags: rita

# ── Resolve RITA version from the artifact server, NOT group_vars ─────────────
# group_vars/all.yml is overwritten by every repo push from the dev machine,
# so the version prep persisted there can be silently reverted, making the
# node request a tarball that is not on the server (observed: prep cached
# v5.1.2, a push reverted group_vars to v5.1.1, node 404d). rita-version.txt
# is written by prep_artefacts.yml right next to the tarball it describes, so
# it can never drift from the artifact actually being served. Fallback to the
# group_vars value exists only for artifact stores built before this file
# existed — with a visible warning, and any mismatch still fails loudly on
# the tarball download rather than deploying the wrong version.

- name: Fetch RITA version from artifact server
  ansible.builtin.uri:
    url: "{{ artifact_base_url }}/rita-version.txt"
    return_content: true
    status_code: [200, 404]
  register: _rita_version_raw
  tags: rita

- name: Pin rita_version to the artefact on the server
  ansible.builtin.set_fact:
    rita_version: "{{ _rita_version_raw.content | trim }}"
  when: _rita_version_raw.status == 200
  tags: rita

- name: Warn if rita-version.txt is missing from the artifact server
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ artifact_base_url }}/rita-version.txt not found — falling
      back to group_vars rita_version ({{ rita_version }}). Re-run
      prep_artefacts.yml on the management box to publish the version file.
  when: _rita_version_raw.status != 200
  tags: rita

- name: Download RITA installer tarball from artifact server
  ansible.builtin.get_url:
    url: "{{ artifact_base_url }}/rita-{{ rita_version }}.tar.gz"
    dest: /tmp/rita-installer.tar.gz
    mode: '0644'
    # force: without it get_url skips the download when the dest exists, so a
    # node re-run within the same boot keeps extracting a STALE installer even
    # after the version on the management box changed. LAN download, cheap.
    force: true
  tags: rita

- name: Extract RITA installer
  ansible.builtin.unarchive:
    src: /tmp/rita-installer.tar.gz
    dest: /tmp
    remote_src: true
  tags: rita

- name: Show installer file tree
  ansible.builtin.shell: |
    find /tmp/rita-{{ rita_version }}-installer -type f | sort
  changed_when: false
  register: rita_tree
  tags: rita

- name: Display installer file tree
  ansible.builtin.debug:
    msg: "{{ rita_tree.stdout_lines }}"
  tags: rita

- name: Copy RITA compose files to /opt/rita
  ansible.builtin.shell: |
    cp -rn /tmp/rita-{{ rita_version }}-installer/files/opt/. /opt/rita/
  changed_when: true
  tags: rita

- name: Create RITA config directory
  ansible.builtin.file:
    path: /etc/rita
    state: directory
    mode: '0755'
  tags: rita

- name: Remove any misplaced config directories
  ansible.builtin.file:
    path: "/etc/rita/{{ item }}"
    state: absent
  loop:
    - config.hjson
    - config.xml
    - http_extensions_list.csv
    - syslog-ng.conf
  tags: rita

- name: Copy RITA config files to /etc/rita
  ansible.builtin.copy:
    src: "/tmp/rita-{{ rita_version }}-installer/files/etc/{{ item }}"
    dest: "/etc/rita/{{ item }}"
    remote_src: true
    mode: '0644'
  loop:
    - config.hjson
    - config.xml
    - http_extensions_list.csv
    - syslog-ng.conf
  tags: rita

- name: Copy RITA threat intel feeds directory
  ansible.builtin.copy:
    src: "/tmp/rita-{{ rita_version }}-installer/files/etc/threat_intel_feeds"
    dest: /etc/rita/
    remote_src: true
  tags: rita

# ── Patch image refs and strip build directive ────────────────────────────────
# prep_artefacts stores images as:  mgmt:5000/rita/<last-path-component>
# docker compose config --images gives the fully-resolved image name;
# awk -F/ '{print $NF}' strips all registry/org prefixes, keeping name:tag.
# We also remove any "build:" lines so Docker won't try to build locally.

- name: Write image patcher script
  ansible.builtin.copy:
    dest: /tmp/rita_patch_images.py
    content: |
      import re, sys
      registry = sys.argv[1]
      path = sys.argv[2]
      content = open(path).read()
      # Rewrite image refs
      def repl(m):
          img = m.group(1).strip()
          local = img.split('/')[-1]
          return 'image: {}/rita/{}'.format(registry, local)
      patched = re.sub(r'image:\s+(\S+)', repl, content)
      # Strip build: lines (no Dockerfile on orochi node)
      patched = re.sub(r'^\s*build:.*\n', '', patched, flags=re.MULTILINE)
      # Add pull_policy: never so containers never attempt to reach the registry at runtime
      def add_pull_policy(m):
          return m.group(0) + '\n' + m.group(1) + 'pull_policy: never'
      patched = re.sub(r'^( +)image: .+$', add_pull_policy, patched, flags=re.MULTILINE)
      open(path, 'w').write(patched)
      print(patched)
    mode: '0755'
  tags: rita

- name: Patch docker-compose.yml to use local registry
  ansible.builtin.command: >
    python3 /tmp/rita_patch_images.py
    "{{ mgmt_box_ip }}:{{ mgmt_registry_port }}"
    /opt/rita/docker-compose.yml
  changed_when: true
  register: rita_compose_patched
  tags: rita

- name: Display patched docker-compose.yml
  ansible.builtin.debug:
    msg: "{{ rita_compose_patched.stdout_lines }}"
  tags: rita

# ── Pull images from local registry then launch ───────────────────────────────

- name: Pull RITA images from local registry
  # `docker compose pull` honors the pull_policy: never we patch into every
  # service, so it skips ALL pulls and exits 0 (observed on the node:
  # "Skipped" x3, rc=0) — a guaranteed no-op that only appeared to work on
  # nodes already holding the images from earlier deployments. Pull per-image
  # with plain docker pull instead, which ignores pull_policy and fails
  # loudly naming the missing image, rather than deferring the explosion to
  # `up`. pull_policy: never STAYS in the compose file — the running stack
  # must never depend on the management box being reachable at runtime.
  ansible.builtin.shell: |
    set -e
    cd /opt/rita
    for img in $(docker compose config --images | sort -u); do
      echo "pulling: $img"
      docker pull "$img"
    done
  changed_when: true
  register: rita_pull
  tags: rita

- name: Install rita wrapper at /usr/local/bin/rita
  ansible.builtin.copy:
    dest: /usr/local/bin/rita
    mode: '0755'
    content: |
      #!/bin/bash
      set -e
      COMPOSE="/opt/rita/docker-compose.yml"
      LOGS=""
      DOCKER_ARGS=("--rm")
      RITA_ARGS=()

      # Parse --logs/-l from args, mount the directory into the container
      while [[ $# -gt 0 ]]; do
        case "$1" in
          -l|--logs)
            LOGS=$(realpath "$2"); shift 2
            RITA_ARGS+=("--logs=/tmp/zeek_logs")
            ;;
          -l=*|--logs=*)
            LOGS=$(realpath "${1#*=}"); shift
            RITA_ARGS+=("--logs=/tmp/zeek_logs")
            ;;
          *) RITA_ARGS+=("$1"); shift ;;
        esac
      done

      [[ -n "$LOGS" ]] && DOCKER_ARGS+=("--volume" "$LOGS:/tmp/zeek_logs")

      exec docker compose -f "$COMPOSE" run "${DOCKER_ARGS[@]}" rita "${RITA_ARGS[@]}"
  tags: rita

- name: Start RITA docker-compose stack
  ansible.builtin.shell: |
    cd /opt/rita
    docker compose up -d --no-build
  changed_when: true
  register: rita_compose_up
  tags: rita

- name: Show docker compose up output
  ansible.builtin.debug:
    msg: "{{ rita_compose_up.stdout_lines | default([]) + rita_compose_up.stderr_lines | default([]) }}"
  tags: rita

- name: Wait for RITA containers to settle
  ansible.builtin.pause:
    seconds: 15
  tags: rita

- name: Verify RITA containers are running
  ansible.builtin.shell: |
    cd /opt/rita
    docker compose ps
  changed_when: false
  register: rita_ps
  tags: rita

- name: Display RITA status
  ansible.builtin.debug:
    msg:
      - "RITA {{ rita_version }} deployed (Docker stack)!"
      - ""
      - "Container status:"
      - "{{ rita_ps.stdout_lines | default([]) }}"
      - ""
      - "Usage:"
      - "  rita import --database=<name> /opt/zeek/logs/current"
      - "  rita view <name>"
      - "  rita html-report <name>"
  tags: rita
