---
# ==============================================
# RITA ROLE - Network Traffic Analysis (Docker-based)
# RITA v5 uses docker-compose with ClickHouse backend.
# All images served from local registry; fully offline.
# No standalone binary — analysis runs inside containers.
# ==============================================

- name: Create RITA directory
  ansible.builtin.file:
    path: /opt/rita
    state: directory
    mode: '0755'
  tags: rita

- name: Create RITA log directory
  ansible.builtin.file:
    path: /var/log/rita
    state: directory
    mode: '0755'
  tags: rita

- name: Download RITA installer tarball from artifact server
  ansible.builtin.get_url:
    url: "{{ artifact_base_url }}/rita-{{ rita_version }}.tar.gz"
    dest: /tmp/rita-installer.tar.gz
    mode: '0644'
  tags: rita

- name: Extract RITA installer
  ansible.builtin.unarchive:
    src: /tmp/rita-installer.tar.gz
    dest: /tmp
    remote_src: true
  tags: rita

- name: Show installer file tree
  ansible.builtin.shell: |
    find /tmp/rita-{{ rita_version }}-installer -type f | sort
  changed_when: false
  register: rita_tree
  tags: rita

- name: Display installer file tree
  ansible.builtin.debug:
    msg: "{{ rita_tree.stdout_lines }}"
  tags: rita

- name: Copy RITA compose files to /opt/rita
  ansible.builtin.shell: |
    cp -rn /tmp/rita-{{ rita_version }}-installer/files/opt/. /opt/rita/
  changed_when: true
  tags: rita

- name: Create RITA config directory
  ansible.builtin.file:
    path: /etc/rita
    state: directory
    mode: '0755'
  tags: rita

- name: Remove any misplaced config directories
  ansible.builtin.file:
    path: "/etc/rita/{{ item }}"
    state: absent
  loop:
    - config.hjson
    - config.xml
    - http_extensions_list.csv
    - syslog-ng.conf
  tags: rita

- name: Copy RITA config files to /etc/rita
  ansible.builtin.copy:
    src: "/tmp/rita-{{ rita_version }}-installer/files/etc/{{ item }}"
    dest: "/etc/rita/{{ item }}"
    remote_src: true
    mode: '0644'
  loop:
    - config.hjson
    - config.xml
    - http_extensions_list.csv
    - syslog-ng.conf
  tags: rita

- name: Copy RITA threat intel feeds directory
  ansible.builtin.copy:
    src: "/tmp/rita-{{ rita_version }}-installer/files/etc/threat_intel_feeds"
    dest: /etc/rita/
    remote_src: true
  tags: rita

# ── Patch image refs and strip build directive ────────────────────────────────
# prep_artefacts stores images as:  mgmt:5000/rita/<last-path-component>
# docker compose config --images gives the fully-resolved image name;
# awk -F/ '{print $NF}' strips all registry/org prefixes, keeping name:tag.
# We also remove any "build:" lines so Docker won't try to build locally.

- name: Write image patcher script
  ansible.builtin.copy:
    dest: /tmp/rita_patch_images.py
    content: |
      import re, sys
      registry = sys.argv[1]
      path = sys.argv[2]
      content = open(path).read()
      # Rewrite image refs
      def repl(m):
          img = m.group(1).strip()
          local = img.split('/')[-1]
          return 'image: {}/rita/{}'.format(registry, local)
      patched = re.sub(r'image:\s+(\S+)', repl, content)
      # Strip build: lines (no Dockerfile on orochi node)
      patched = re.sub(r'^\s*build:.*\n', '', patched, flags=re.MULTILINE)
      # Add pull_policy: never so containers never attempt to reach the registry at runtime
      def add_pull_policy(m):
          return m.group(0) + '\n' + m.group(1) + 'pull_policy: never'
      patched = re.sub(r'^( +)image: .+$', add_pull_policy, patched, flags=re.MULTILINE)
      open(path, 'w').write(patched)
      print(patched)
    mode: '0755'
  tags: rita

- name: Patch docker-compose.yml to use local registry
  ansible.builtin.command: >
    python3 /tmp/rita_patch_images.py
    "{{ mgmt_box_ip }}:{{ mgmt_registry_port }}"
    /opt/rita/docker-compose.yml
  changed_when: true
  register: rita_compose_patched
  tags: rita

- name: Display patched docker-compose.yml
  ansible.builtin.debug:
    msg: "{{ rita_compose_patched.stdout_lines }}"
  tags: rita

# ── Pull images from local registry then launch ───────────────────────────────

- name: Pull RITA images from local registry
  ansible.builtin.shell: |
    cd /opt/rita
    docker compose pull
  changed_when: true
  register: rita_pull
  tags: rita

- name: Install rita wrapper at /usr/local/bin/rita
  ansible.builtin.copy:
    dest: /usr/local/bin/rita
    mode: '0755'
    content: |
      #!/bin/bash
      set -e
      COMPOSE="/opt/rita/docker-compose.yml"
      LOGS=""
      DOCKER_ARGS=("--rm")
      RITA_ARGS=()

      # Parse --logs/-l from args, mount the directory into the container
      while [[ $# -gt 0 ]]; do
        case "$1" in
          -l|--logs)
            LOGS=$(realpath "$2"); shift 2
            RITA_ARGS+=("--logs=/tmp/zeek_logs")
            ;;
          -l=*|--logs=*)
            LOGS=$(realpath "${1#*=}"); shift
            RITA_ARGS+=("--logs=/tmp/zeek_logs")
            ;;
          *) RITA_ARGS+=("$1"); shift ;;
        esac
      done

      [[ -n "$LOGS" ]] && DOCKER_ARGS+=("--volume" "$LOGS:/tmp/zeek_logs")

      exec docker compose -f "$COMPOSE" run "${DOCKER_ARGS[@]}" rita "${RITA_ARGS[@]}"
  tags: rita

- name: Start RITA docker-compose stack
  ansible.builtin.shell: |
    cd /opt/rita
    docker compose up -d --no-build
  changed_when: true
  register: rita_compose_up
  tags: rita

- name: Show docker compose up output
  ansible.builtin.debug:
    msg: "{{ rita_compose_up.stdout_lines | default([]) + rita_compose_up.stderr_lines | default([]) }}"
  tags: rita

- name: Wait for RITA containers to settle
  ansible.builtin.pause:
    seconds: 15
  tags: rita

- name: Verify RITA containers are running
  ansible.builtin.shell: |
    cd /opt/rita
    docker compose ps
  changed_when: false
  register: rita_ps
  tags: rita

- name: Display RITA status
  ansible.builtin.debug:
    msg:
      - "RITA {{ rita_version }} deployed (Docker stack)!"
      - ""
      - "Container status:"
      - "{{ rita_ps.stdout_lines | default([]) }}"
      - ""
      - "Usage:"
      - "  rita import --database=<name> /opt/zeek/logs/current"
      - "  rita view <name>"
      - "  rita html-report <name>"
  tags: rita
