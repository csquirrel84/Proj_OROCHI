---
- name: Gather facts if not already gathered
  ansible.builtin.setup:
  when: ansible_facts['distribution'] is not defined
  tags: zeek

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  tags: zeek

- name: Download Zeek GPG key from artifact server
  ansible.builtin.get_url:
    url: "{{ artifact_base_url }}/zeek-release.key"
    dest: /tmp/zeek-release.key
    mode: '0644'
  tags: zeek

- name: Add Zeek GPG key to trusted keyring
  ansible.builtin.shell: |
    gpg --dearmor < /tmp/zeek-release.key > /etc/apt/keyrings/zeek-archive-keyring.gpg
  args:
    creates: /etc/apt/keyrings/zeek-archive-keyring.gpg
  tags: zeek

# ── Pre-create all Zeek directories and config files ──────────────────────────
# Done before package install so dpkg can never fail on missing paths.
# Uses facts already set by the environment role (suricata.interface etc).

- name: Create Zeek directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /opt/zeek/etc
    - /opt/zeek/logs
    - /opt/zeek/spool
    - /opt/zeek/share/zeek/site
  tags: zeek

- name: Configure Zeek node.cfg
  ansible.builtin.copy:
    dest: /opt/zeek/etc/node.cfg
    mode: '0644'
    content: |
      [zeek]
      type=standalone
      host=localhost
      interface={{ suricata.interface }}
  tags: zeek

- name: Configure Zeek networks.cfg
  ansible.builtin.copy:
    dest: /opt/zeek/etc/networks.cfg
    mode: '0644'
    content: |
      {{ suricata.home_net }}   Monitored network
      10.0.0.0/8          Private IP space
      172.16.0.0/12       Private IP space
      192.168.0.0/16      Private IP space
  tags: zeek

- name: Configure zeekctl.cfg
  ansible.builtin.copy:
    dest: /opt/zeek/etc/zeekctl.cfg
    mode: '0644'
    content: |
      MailTo = root@localhost
      MailFrom = Zeek <zeek@localhost>
      LogRotationInterval = 3600
      LogExpireInterval = 0
      StatsLogEnable = 1
      StatsLogExpireInterval = 0
      StatusCmdShowAll = 0
      LogDir = /opt/zeek/logs
      SpoolDir = /opt/zeek/spool
      PolicyDir = /opt/zeek/share/zeek
      SitePolicyScripts = local.zeek
  tags: zeek

- name: Create Zeek local site policy
  ansible.builtin.copy:
    dest: /opt/zeek/share/zeek/site/local.zeek
    mode: '0644'
    content: |
      @load base/frameworks/software
      @load base/protocols/conn
      @load base/protocols/dns
      @load base/protocols/http
      @load base/protocols/ssl
      @load base/protocols/ssh
      @load base/protocols/ftp
      @load base/protocols/smtp
      @load policy/tuning/json-logs
      @load policy/protocols/conn/known-hosts
      @load policy/protocols/conn/known-services
      @load policy/protocols/ssl/known-certs
      @load frameworks/files/hash-all-files
      redef LogAscii::use_json = T;
  tags: zeek

# ── Install ────────────────────────────────────────────────────────────────────

- name: Create temp directory for Zeek debs
  ansible.builtin.file:
    path: /tmp/zeek-debs
    state: directory
    mode: '0755'
  tags: zeek

- name: Download Zeek debs tarball from artifact server
  ansible.builtin.get_url:
    url: "{{ artifact_base_url }}/zeek-debs.tar.gz"
    dest: /tmp/zeek-debs.tar.gz
    mode: '0644'
    # force: without it get_url skips the download when the dest exists, so a
    # node re-run within the same boot keeps installing a STALE bundle even
    # after the management box regenerated it. LAN download, negligible cost.
    force: true
  tags: zeek

- name: Extract Zeek debs
  ansible.builtin.unarchive:
    src: /tmp/zeek-debs.tar.gz
    dest: /tmp
    remote_src: true
  tags: zeek

- name: Install Zeek from pre-cached packages
  # WHY apt-get, not `dpkg -i *.deb`: the bundle is a full dependency closure;
  # a flat dpkg glob unpacks in filename order and fails when a package lands
  # before its pre-dependency is configured. apt orders pre-dependencies
  # correctly. Safe to re-run: apt heals a half-installed state.
  #
  # WHY --no-install-recommends (required, not cosmetic): zeekctl Recommends
  # mail-transport-agent, and apt satisfies that by pulling courier-mta plus
  # courier-authlib, gnutls-bin, libunbound8. The bundle was built with
  # --no-install-recommends so none of those are present; without this flag
  # apt tries to fetch them from the internet and fails on an offline node.
  # dpkg -i never hit this because dpkg ignores Recommends entirely.
  #
  # WHY NO --no-download: apt has a bug where --no-download combined with
  # local .deb file arguments registers each deb under its basename, then the
  # install stage rejects it with "Internal Error, Pathname to install is not
  # absolute" (reproduced on hello_2.10 with a stock apt — the flag, not the
  # path form, is the trigger). The flag is also unnecessary for offline
  # safety: every dependency is local, so apt has nothing to fetch; if a
  # future bundle were incomplete, apt would fail loudly on the unreachable
  # repo either way. The ./*.deb form (not bare filenames) is what tells apt
  # these are files, not package names.
  #
  # DEBIAN_FRONTEND exported for the WHOLE block including dpkg --configure
  # -a: without it a half-configured package throwing a conffile/debconf
  # question blocks forever on stdin that never comes.
  #
  # NOTE: no comments inside the shell block below — Ansible runs shell
  # content through its argument splitter, and prose (apostrophes, parens)
  # trips "unbalanced jinja2 block or quotes". Commentary lives up here.
  # Success is judged on STATE, not log text: the final dpkg-query verifies
  # zeek-core is actually installed, and its exit code is the task result. A
  # failed_when that greps for "Setting up zeek-core" breaks idempotency —
  # on a re-run where Zeek is already installed apt legitimately prints
  # "0 upgraded, 0 newly installed" and sets up nothing, which is success,
  # not failure.
  ansible.builtin.shell: |
    set -e
    export DEBIAN_FRONTEND=noninteractive
    trap 'rm -f /usr/sbin/policy-rc.d' EXIT
    echo 'exit 101' > /usr/sbin/policy-rc.d
    chmod +x /usr/sbin/policy-rc.d
    dpkg --configure -a --force-confold || true
    cd /tmp/zeek-debs
    apt-get install -y \
      --no-install-recommends --allow-downgrades \
      -o Dpkg::Options::=--force-confold \
      -o Dpkg::Options::=--force-confdef \
      -o DPkg::Lock::Timeout=300 \
      ./*.deb
    dpkg-query -W -f '${db:Status-Status}' zeek-core | grep -qx installed
  register: zeek_install
  changed_when: "'Setting up' in zeek_install.stdout"
  tags: zeek

- name: Add Zeek to system PATH
  ansible.builtin.copy:
    dest: /etc/profile.d/zeek.sh
    content: |
      export PATH=/opt/zeek/bin:$PATH
    mode: '0644'
  tags: zeek

# ── Deploy ─────────────────────────────────────────────────────────────────────

- name: Install Zeek configuration
  ansible.builtin.shell: /opt/zeek/bin/zeekctl install
  environment:
    PATH: "/opt/zeek/bin:{{ ansible_facts['env'].PATH }}"
  changed_when: false
  tags: zeek

- name: Deploy Zeek
  ansible.builtin.shell: /opt/zeek/bin/zeekctl deploy
  environment:
    PATH: "/opt/zeek/bin:{{ ansible_facts['env'].PATH }}"
  changed_when: false
  tags: zeek

- name: Create Zeek systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/zeek.service
    mode: '0644'
    content: |
      [Unit]
      Description=Zeek Network Security Monitor
      After=network.target network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/opt/zeek/bin/zeekctl start
      ExecStop=/opt/zeek/bin/zeekctl stop
      ExecReload=/opt/zeek/bin/zeekctl restart
      TimeoutStartSec=300
      TimeoutStopSec=60

      [Install]
      WantedBy=multi-user.target
  tags: zeek

- name: Enable and start Zeek service
  ansible.builtin.systemd:
    name: zeek
    enabled: true
    state: started
    daemon_reload: true
  tags: zeek

# The zeek systemd unit is Type=oneshot — a crashed Zeek worker is never
# restarted by systemd. `zeekctl cron` restarts crashed workers and rotates
# stats; this is the supervision mechanism ZeekControl expects.
# Implemented as a systemd timer, NOT ansible.builtin.cron: Ubuntu Server
# minimal has no crontab binary and the node is offline, so cron cannot be
# assumed or installed.
- name: Create zeekctl watchdog service unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/zeekctl-cron.service
    mode: '0644'
    content: |
      [Unit]
      Description=ZeekControl cron watchdog (restarts crashed Zeek workers)
      After=zeek.service

      [Service]
      Type=oneshot
      ExecStart=/opt/zeek/bin/zeekctl cron
  tags: zeek

- name: Create zeekctl watchdog timer unit
  ansible.builtin.copy:
    dest: /etc/systemd/system/zeekctl-cron.timer
    mode: '0644'
    content: |
      [Unit]
      Description=Run zeekctl cron every 5 minutes

      [Timer]
      OnBootSec=5min
      OnUnitActiveSec=5min

      [Install]
      WantedBy=timers.target
  tags: zeek

- name: Enable and start zeekctl watchdog timer
  ansible.builtin.systemd:
    name: zeekctl-cron.timer
    enabled: true
    state: started
    daemon_reload: true
  tags: zeek

- name: Check Zeek status
  ansible.builtin.shell: /opt/zeek/bin/zeekctl status
  environment:
    PATH: "/opt/zeek/bin:{{ ansible_facts['env'].PATH }}"
  register: zeek_status
  changed_when: false
  failed_when: false
  tags: zeek

- name: Display Zeek status
  ansible.builtin.debug:
    msg:
      - "Zeek installed and running on {{ suricata.interface }}"
      - "Logs: /opt/zeek/logs"
      - "{{ zeek_status.stdout_lines }}"
  tags: zeek
