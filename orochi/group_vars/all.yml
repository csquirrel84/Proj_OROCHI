---
# ==============================================
# OROCHI SECURITY STACK - MAIN CONFIGURATION
# ==============================================

orochi_base_path: /opt/orochi
orochi_project_name: orochi
orochi_network_name: orochi-network
orochi_server_ip: "{{ ansible_host | default('127.0.0.1') }}"

# Per-operation configuration file. fuse.yml prompts for an operation name
# at startup and overrides this with <OP_NAME>.env — one config per op.
# This default only applies when a role is run outside fuse.
env_file: "{{ playbook_dir }}/.env"

elasticsearch:
  cluster_name: "orochi"
  license: "basic"


# ==============================================
# MANAGEMENT BOX
# ==============================================
# Production: direct ethernet link 10.16.255.253
# Override via -e mgmt_box_ip=100.99.102.28 for dev
mgmt_box_ip: "10.16.255.253"
mgmt_registry_port: 5000
mgmt_apt_proxy_port: 3142
mgmt_artifact_port: 8888

artifact_base_url: "http://{{ mgmt_box_ip }}:{{ mgmt_artifact_port }}"


# ==============================================
# VERSION PINNING
# ==============================================
stack_version: "9.3.4"
elasticsearch_hive_version: "7.17.9"
thehive_version: "4.1.19"
cassandra_version: "4.0"
cyberchef_version: "latest"
mattermost_version: "latest"
postgres_version: "15-alpine"
portal_version: "alpine"
rita_version: "v5.1.2"
arkime_version: "v6-latest"
timesketch_version: "latest"
redis_version: "7-alpine"

# ── Elastic Agent installer mirror ────────────────────────────────────────────
# Endpoints on the target network cannot reach artifacts.elastic.co, so the
# node hosts its own Elastic Artifact Registry (see roles/fleet). Packages are
# mirrored by prep_artefacts.yml and served from the node.
#
# EMPTY LIST = AUTO-DISCOVER: prep queries the Elastic artifacts API for the
# stack version actually being deployed and mirrors every installable package
# it finds. This is why bumping the Elastic version needs no edit here.
#
# For 9.x that is 12 packages:
#   Windows  .zip + .msi   (x86_64, arm64)
#   Linux    .tar.gz       (x86_64, arm64)
#   macOS    .tar.gz       (x86_64/Intel, aarch64/Apple Silicon)
#   Debian   .deb          (amd64, arm64)
#   RedHat   .rpm          (x86_64, aarch64)
#
# SIZE: roughly 10-12 GB, stored on the management box AND again on the node.
# prep and the fleet role both refuse to start the download if free space is
# below elastic_agent_mirror_min_free_gb.
#
# To pin an explicit set instead of auto-discovery, list exact upstream
# filenames here, e.g.:
#   elastic_agent_artifacts:
#     - "elastic-agent-{{ stack_version }}-windows-x86_64.zip"
#     - "elastic-agent-{{ stack_version }}-linux-x86_64.tar.gz"
elastic_agent_artifacts: []

# Package types kept by auto-discovery. Docker images, build contexts and the
# -core/-fips/-cloud/-slim/-wolfi/-complete/-service variants are always
# excluded: none of them are what an endpoint installs.
elastic_agent_package_types:
  - zip     # Windows
  - msi     # Windows installer
  - tar     # Linux + macOS tarballs
  - deb     # Debian/Ubuntu
  - rpm     # RHEL/Rocky/SUSE

# Abort the mirror rather than filling the disk. Applies to the management
# box (/opt/orochi/artifacts) and the node (/opt/orochi/agent-artifacts).
elastic_agent_mirror_min_free_gb: 20


# ==============================================
# DOCKER IMAGE REFERENCES
# All pulled from local registry on management box
# ==============================================
images:
  elasticsearch:      "{{ mgmt_box_ip }}:{{ mgmt_registry_port }}/elasticsearch/elasticsearch:{{ stack_version }}"
  elasticsearch_hive: "{{ mgmt_box_ip }}:{{ mgmt_registry_port }}/elasticsearch/elasticsearch:{{ elasticsearch_hive_version }}"
  kibana:             "{{ mgmt_box_ip }}:{{ mgmt_registry_port }}/kibana/kibana:{{ stack_version }}"
  elastic_agent:      "{{ mgmt_box_ip }}:{{ mgmt_registry_port }}/elastic-agent/elastic-agent:{{ stack_version }}"
  cassandra:          "{{ mgmt_box_ip }}:{{ mgmt_registry_port }}/cassandra:{{ cassandra_version }}"
  thehive:            "{{ mgmt_box_ip }}:{{ mgmt_registry_port }}/thehiveproject/thehive4:{{ thehive_version }}"
  debian_slim:        "{{ mgmt_box_ip }}:{{ mgmt_registry_port }}/debian:bookworm-slim"
  mattermost:         "{{ mgmt_box_ip }}:{{ mgmt_registry_port }}/mattermost/mattermost-team-edition:{{ mattermost_version }}"
  postgres:           "{{ mgmt_box_ip }}:{{ mgmt_registry_port }}/postgres:{{ postgres_version }}"
  cyberchef:          "{{ mgmt_box_ip }}:{{ mgmt_registry_port }}/gchq/cyberchef:{{ cyberchef_version }}"
  nginx:              "{{ mgmt_box_ip }}:{{ mgmt_registry_port }}/nginx:{{ portal_version }}"
  timesketch:         "{{ mgmt_box_ip }}:{{ mgmt_registry_port }}/timesketch/timesketch:{{ timesketch_version }}"
  redis:              "{{ mgmt_box_ip }}:{{ mgmt_registry_port }}/redis:{{ redis_version }}"
  arkime:             "{{ mgmt_box_ip }}:{{ mgmt_registry_port }}/arkime/arkime:{{ arkime_version }}"


# ==============================================
# PORT CONFIGURATION
# ==============================================
ports:
  elasticsearch: 9200
  kibana: 5601
  fleet: 8220
  thehive: 9000
  velociraptor_gui: 8889
  velociraptor_frontend: 8000
  velociraptor_api: 8001
  arkime: 8005
  arkime_capture: 8006
  cyberchef: 8080
  mattermost: 8065
  timesketch: 5000
  portal_http: 80
  portal_https: 443
  # Node-hosted Elastic Artifact Registry — endpoints fetch agent installers
  # and upgrade binaries from here instead of artifacts.elastic.co.
  agent_artifacts: 8890


# ==============================================
# RESOURCE LIMITS
# ==============================================
resources:
  kibana:
    memory: "2g"
  thehive:
    memory: "2g"
  cassandra:
    memory: "2g"
    heap: "1024M"
    heap_new: "256M"
  elasticsearch:
    memory: "4g"
    heap: "2g"
  elasticsearch_hive:
    memory: "1g"
    heap: "512m"
  mattermost:
    memory: "1g"
  timesketch:
    memory: "2g"
  redis:
    memory: "256m"


# ==============================================
# SURICATA / ZEEK / ARKIME CAPTURE INTERFACE
# Set at runtime by the environment role via interactive selection.
# Default here is a safe fallback only — never used in normal runs.
# ==============================================
suricata:
  interface: "eth0"
  home_net: "192.168.0.0/16"


# ==============================================
# WIREGUARD
# ==============================================
wireguard_port: 51820
wireguard_interface: wg0
wireguard_server_ip: 10.99.0.1/24
wireguard_peer_ip: 10.99.0.2/32


# ==============================================
# AUTHENTICATION
# common_password is prompted at runtime by fuse.yml
# ==============================================
orochi_admin_user: "admin"
orochi_admin_password: "{{ common_password }}"

elasticsearch_password: "{{ common_password }}"
kibana_password: "{{ common_password }}"
thehive_password: "{{ common_password }}"
velox_user: "{{ orochi_admin_user }}"
velociraptor_password: "{{ common_password }}"
mattermost_password: "{{ common_password }}"
arkime_password: "{{ common_password }}"
arkime_password_secret: "{{ common_password }}"
timesketch_password: "{{ common_password }}"


# ==============================================
# DATA DIRECTORIES
# ==============================================
directories:
  certs: "{{ orochi_base_path }}/certs"
  elasticsearch: "{{ orochi_base_path }}/elasticsearch"
  kibana: "{{ orochi_base_path }}/kibana"
  fleet: "{{ orochi_base_path }}/fleet"
  thehive: "{{ orochi_base_path }}/thehive"
  thehive_es: "{{ orochi_base_path }}/thehive-es"
  cassandra: "{{ orochi_base_path }}/cassandra"
  velociraptor: "{{ orochi_base_path }}/velociraptor"
  suricata: "{{ orochi_base_path }}/suricata"
  arkime: "{{ orochi_base_path }}/arkime"
  mattermost: "{{ orochi_base_path }}/mattermost"
  postgres: "{{ orochi_base_path }}/postgres"
  postgres_timesketch: "{{ orochi_base_path }}/postgres-timesketch"
  timesketch: "{{ orochi_base_path }}/timesketch"
  portal: "{{ orochi_base_path }}/portal"
  rita: "{{ orochi_base_path }}/rita"
  logs: "{{ orochi_base_path }}/logs"
  agent_artifacts: "{{ orochi_base_path }}/agent-artifacts"
